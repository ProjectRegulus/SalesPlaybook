{n:{en:"Ask before you offer",es:"Pregunta antes de ofrecer"},t:{en:"What changed since last time?",es:"¿Qué cambió desde la última vez?"},s:{en:"Even with a past customer, don't assume you know what they need today. Ask what's going on, guests, a move, a new baby, the house is bigger than the time you've got, and dig one level into what they say. Then confirm the basics you may already have on file (bedrooms, bathrooms, pets, access) instead of asking them again from scratch.",es:"Aunque sea un cliente pasado, no asumas que sabes qué necesita hoy. Pregunta qué está pasando, visitas, una mudanza, un bebé, la casa es más grande que el tiempo que tienen, y profundiza un nivel en lo que digan. Luego confirma lo básico que quizá ya tienes en el registro (recámaras, baños, mascotas, acceso) en vez de volver a preguntarlo desde cero."},ex:[Y("What's changed around the house since we were there? Anything you've been putting off?"),T("Honestly, with the new baby we haven't kept up with anything."),Y("That makes total sense, sleep first, baseboards later. Which parts of the house bother you most right now?"),Y("Still the 3 bedrooms and 2 baths, and Max the dog? Same code on the garage?"),Y("So a deep clean to reset things, and then something regular so it doesn't pile up again. Does that sound right?")],a:{en:"Reading their old file back to them as if nothing changed.",es:"Leerles su registro viejo como si nada hubiera cambiado."},x:{en:"Recommend and price.",es:"Recomienda y cotiza."}},
{n:{en:"Recommend & price",es:"Recomendar y cotizar"},t:{en:"Name the service, say the number, offer a choice",es:"Nombra el servicio, di el número, ofrece una opción"},s:{en:"Based on what they told you, recommend one service, not a menu, and explain in plain words what it includes. Then the price from your approved rates, said once, tied to what's included. For past customers, reference what they paid before so the number feels familiar. Offer two options (one-time vs. recurring, this week vs. next) and stop talking.",es:"Con lo que te contaron, recomienda un servicio, no un menú, y explica en palabras simples qué incluye. Luego el precio desde tus tarifas aprobadas, dicho una vez, atado a lo que incluye. Con clientes pasados, referencia lo que pagaron antes para que el número suene familiar. Ofrece dos opciones (una vez vs. recurrente, esta semana vs. la próxima) y deja de hablar."},ex:[Y("I'd start with a deep clean to reset everything, bathrooms detailed, kitchen, baseboards, floors, the works, that's [rate], same as last time plus the extra bathroom. Then biweekly at [rate] keeps it there without you thinking about it."),Y("For the spring clean, same scope as March: [rate]. If you'd rather do the inside of the fridge and oven too, that adds [rate] each."),Y("Two ways to go: the deep clean on its own, or the deep clean plus biweekly, which brings the first visit down to [rate]. Which sounds better?")],a:{en:"A list of packages · a price with no scope · discounting to reopen the relationship.",es:"Una lista de paquetes · un precio sin alcance · descontar para reabrir la relación."},x:{en:"Silence, then close, or handle the objection.",es:"Silencio, luego cierra, o maneja la objeción."}},
{n:{en:"Objections",es:"Objeciones"},t:{en:"One sentence, one reason, back to the calendar",es:"Una frase, una razón, de vuelta al calendario"},s:{en:"On a warm call the objections are softer but the same: money, timing, “let me ask my spouse”, “we found someone cheaper”. Acknowledge in one sentence, give one reason, and return to the two slots. If price is the issue, reduce the scope, never the rate. If it is timing, get the month and put it in the CRM, that is still a win.",es:"En una llamada tibia las objeciones son más suaves pero las mismas: dinero, timing, “déjame preguntarle a mi esposa/o”, “encontramos alguien más barato”. Reconoce en una frase, da una razón y vuelve a los dos horarios. Si el problema es precio, reduce el alcance, nunca la tarifa. Si es timing, consigue el mes y ponlo en el CRM, eso sigue siendo una ganancia."},ex:[T("Money's tight this month."),Y("I hear you. We can do the bathrooms and kitchen only at [rate] and leave the rest for when it makes sense. Would that help for now?"),T("We found someone cheaper."),Y("That's fair, usually it's a smaller scope or supplies not included. What I can promise is the same team you had, everything on the list, and we come back if anything's missed. Want me to hold Thursday while you compare?"),T("Let me ask my husband."),Y("Of course. I'll text you the quote so you both have it. Can I hold Thursday morning until tomorrow? I'll check in either way."),T("Maybe in a couple of months."),Y("Perfect, spring is our busiest, so let me pencil you in for the second week of April and I'll confirm two weeks before. Does that work?")],a:{en:"Pushing after a clear no · lowering the price · hanging up without a month.",es:"Insistir después de un no claro · bajar el precio · colgar sin un mes."},x:{en:"Book it, or a month + reminder in the CRM.",es:"Resérvalo, o un mes + recordatorio en el CRM."}},
{n:{en:"Close on this call",es:"Cierra en esta llamada"},t:{en:"Two slots, the details, the confirmation",es:"Dos horarios, los datos, la confirmación"},s:{en:"Same as inbound: ask when they'd like it done, offer two slots, confirm the address and access from your file, ask about anything new (pets, parking, alarm), and read the booking back. The written quote goes out right after as documentation, not as something to think about. Then the recurring offer, if it fits.",es:"Igual que inbound: pregunta cuándo lo quieren, ofrece dos horarios, confirma dirección y acceso desde tu registro, pregunta por lo nuevo (mascotas, estacionamiento, alarma) y lee la reserva de vuelta. La cotización escrita sale justo después como documentación, no como algo para pensar. Luego la oferta recurrente, si aplica."},ex:[Y("When would you like us there, this week or next?"),Y("I've got Thursday at 9 or Saturday at 1. Which is better?"),Y("Same address and garage code as before? Anything new, parking, pets, alarm?"),Y("You're set: Saturday at 1, deep clean, [rate], everything we talked about. I'll text the confirmation now so you have it in writing, and the team will text when they're on the way."),Y("And since we're resetting the house, want me to put you on biweekly after that? Same team, [rate] per visit, you can always adjust.")],a:{en:"“I'll send you the quote and you let me know” · ending without a slot.",es:"“Le mando la cotización y me avisa” · terminar sin horario."},x:{en:"Confirmation text now; reminder the day before.",es:"Texto de confirmación ahora; recordatorio el día anterior."}},
{n:{en:"After the call",es:"Después de la llamada"},t:{en:"Confirm in writing, update the record",es:"Confirma por escrito, actualiza el registro"},s:{en:"Send the confirmation with the quote in writing within minutes. Update the record: what they booked, what changed at the house, what they said no to and why, the recurring offer and their answer. If they didn't book, the month and the reason go in the CRM with a reminder, a warm lead you follow up on time closes more often than a new one.",es:"Manda la confirmación con la cotización por escrito en minutos. Actualiza el registro: qué reservaron, qué cambió en la casa, a qué dijeron que no y por qué, la oferta recurrente y su respuesta. Si no reservaron, el mes y el motivo van al CRM con recordatorio, un lead tibio con seguimiento a tiempo cierra más que uno nuevo."},ex:[Y("Hi [Name], it's [Name] with [Company]. Confirmed: Saturday at 1, deep clean, [rate]. Included: [scope]. Reply here with anything we should know. Thank you!"),Y("Hi [Name], as we talked, the quote for the deep clean is [rate], everything included. I'm holding Thursday 9 until tomorrow; reply YES to lock it."),Y("CRM note: past customer, new baby, deep clean Sat 1pm [rate], declined biweekly for now, revisit in 2 months. Garage code same. Dog: Max.")],a:{en:"Skipping the confirmation · leaving the record as it was.",es:"Saltarte la confirmación · dejar el registro como estaba."},x:{en:"Reminder → service → review → recurring.",es:"Recordatorio → servicio → reseña → recurrente."}}],
email:[
{n:{en:"Reply to an inquiry",es:"Responder una consulta"},t:{en:"Answer fast, recommend, price, two slots",es:"Responde rápido, recomienda, cotiza, dos horarios"},s:{en:"A web form or email asking “how much for a 3-bedroom?” is a hot lead that goes cold in an hour. Reply within minutes, ask the two things you are missing if you must, recommend one service, give the price from approved rates with what's included, and offer two slots. Always add your phone and offer to text, most of these close by text or phone, not by email.",es:"Un formulario web o email preguntando “¿cuánto por una casa de 3 recámaras?” es un lead caliente que se enfría en una hora. Responde en minutos, pregunta las dos cosas que te faltan si hace falta, recomienda un servicio, da el precio desde tarifas aprobadas con lo que incluye y ofrece dos horarios. Siempre agrega tu teléfono y ofrece texto, la mayoría de estos cierran por texto o teléfono, no por email."},ex:[Y("Subject: Your cleaning quote · [Address]\n\nHi [Name], thanks for reaching out! Based on what you shared, 3 bedrooms, 2 baths, it's been a while, I'd recommend a full deep clean to reset the house: bathrooms detailed, kitchen, baseboards, floors, dusting including fans. That's [rate], supplies and a team of two included.\n\nWe have Thursday at 9 or Saturday at 1. Reply with the one that works and I'll confirm right away, or text me at [phone] if that's easier.\n\n,  [Name], [Company]"),Y("Subject: Two quick questions · [Address]\n\nHi [Name], happy to help! So I quote it right: how many bedrooms and bathrooms, and is this a one-time clean or something regular? Or call/text me at [phone] and I'll have a price for you in two minutes.")],a:{en:"Replying the next day · a price list · “let me know if you have questions”.",es:"Responder al día siguiente · una lista de precios · “avíseme si tiene preguntas”."},x:{en:"Reply → booked → confirmation.",es:"Respuesta → reservado → confirmación."}},
{n:{en:"Confirmation & written quote",es:"Confirmación y cotización escrita"},t:{en:"Documentation of what they already booked",es:"Documentación de lo que ya reservaron"},s:{en:"Send it right after the call: date, time, service, total, what's included, add-ons, access notes, cancellation policy. It's not a proposal to consider, it's the record of the booking. Clear enough that they never need to call to ask.",es:"Envíalo justo después de la llamada: fecha, hora, servicio, total, qué incluye, extras, notas de acceso, política de cancelación. No es una propuesta para considerar, es el registro de la reserva. Tan claro que nunca tengan que llamar a preguntar."},ex:[Y("Subject: Confirmed, deep clean Thursday 9:00 · [Address]\n\nHi [Name], great talking with you! Here's everything in writing:\n\nService: Deep clean · Thursday [date], 9:00 am · team of 2, ~4 hours\nTotal: [rate], supplies and equipment included\nIncluded: all bathrooms detailed, kitchen incl. inside microwave, baseboards, floors, dusting incl. ceiling fans, pet-hair treatment on upholstery\nNot included: inside oven / fridge (available as add-ons: [rate] each)\nAccess: code [ ] · two dogs, friendly\nPolicy: reschedule free up to 24 h before.\n\nReply here with anything to add. See you Thursday!, [Name], [Company]")],a:{en:"Sending it as a “proposal” · a PDF with ten pages of services.",es:"Enviarla como “propuesta” · un PDF de diez páginas de servicios."},x:{en:"Reminder text the day before.",es:"Texto recordatorio el día anterior."}},
{n:{en:"Quote not booked",es:"Cotización no reservada"},t:{en:"The written quote with a held slot",es:"La cotización escrita con un horario apartado"},s:{en:"When they needed to check with someone, the email is short: the number, what's included, the slot you're holding, and one line to confirm. Follow up by text the next day.",es:"Cuando necesitaban consultar con alguien, el email es corto: el número, qué incluye, el horario que apartaste y una línea para confirmar. Seguimiento por texto al día siguiente."},ex:[Y("Subject: Your cleaning quote · [Address]\n\nHi [Name], as promised: a 3-bed, 2-bath deep clean is [rate], everything included (list below). I'm holding Thursday 9:00 for you until tomorrow, just reply YES and you're booked, or tell me a better day.\n\nIncluded: [scope]\nAdd-ons: inside oven [rate], inside fridge [rate], interior windows [rate]\n\n,  [Name], [Company]")],a:{en:"Long emails · no slot held · waiting more than a day to follow up.",es:"Emails largos · sin horario apartado · esperar más de un día para dar seguimiento."},x:{en:"Text tomorrow: “still want Thursday?”",es:"Texto mañana: “¿todavía quiere el jueves?”"}},
{n:{en:"Review & recurring",es:"Reseña y recurrente"},t:{en:"After the job, two emails that grow the account",es:"Después del trabajo, dos emails que hacen crecer la cuenta"},s:{en:"Same day: thank you + review link + “anything not right, we fix it”. Two weeks later: the recurring offer with a specific day and price.",es:"Mismo día: gracias + enlace de reseña + “si algo no quedó bien, lo arreglamos”. Dos semanas después: la oferta recurrente con día y precio específicos."},ex:[Y("Subject: Thank you, [Name]!\n\nHi [Name], thanks for having us today. If everything looked great, a quick Google review helps us more than you know: [link]. If anything isn't right, reply here and we'll come back, that's the guarantee.\n\n,  [Name], [Company]"),Y("Subject: Keep it that way? Biweekly for [Address]\n\nHi [Name], it's been two weeks since your deep clean. Most of our clients keep the house at that level with biweekly service: same team, every other [day], [rate] per visit (vs. [rate] one-time). Want me to start you on [date]? Reply YES and I'll confirm.")],a:{en:"Asking for the review a month later · generic newsletters.",es:"Pedir la reseña un mes después · boletines genéricos."},x:{en:"Recurring client → referral ask.",es:"Cliente recurrente → pedir referido."}}],
sms:[
{n:{en:"Inbound text → booked",es:"Texto inbound → reservado"},t:{en:"Five messages from “hi” to a date",es:"Cinco mensajes de “hola” a una fecha"},s:{en:"Most residential jobs can be sold entirely by text. Reply within minutes, ask size and service, recommend, price from approved rates, two slots, confirm. Three lines per message maximum.",es:"La mayoría de los trabajos residenciales se venden por texto. Responde en minutos, pregunta tamaño y servicio, recomienda, cotiza desde tarifas aprobadas, dos horarios, confirma. Máximo tres líneas por mensaje."},ex:[Y("Hi [Name], thanks for reaching out to [Company]! Happy to help. Tell me a bit about the home and what you're looking for."),T("3 bed 2 bath, it's been a while since a real clean, we have guests coming."),Y("Got it, guests coming and it's been a while. How soon are they arriving? And any pets or areas you want extra attention on?"),Y("Perfect, for a 3/2 that hasn't had a deep clean in a while I'd recommend our full deep clean: bathrooms detailed, kitchen, baseboards, floors, dusting incl. fans. That's [rate], supplies included, team of 2."),Y("We have Thursday at 9 or Saturday at 1. Which works better?"),T("Saturday."),Y("Saturday at 1 it is! What's the address, and will someone be home or should we use a code? Any pets?"),Y("You're booked: Sat [date] 1:00 pm · deep clean · [rate] · [scope]. I'll text a reminder Friday. Thank you, [Name]!")],a:{en:"A price before size and condition · five questions in one text · replying hours later.",es:"Precio antes de tamaño y condición · cinco preguntas en un texto · responder horas después."},x:{en:"Confirmation → reminder.",es:"Confirmación → recordatorio."}},
{n:{en:"Price & objections by text",es:"Precio y objeciones por texto"},t:{en:"Confident number, one reason, back to the slot",es:"Número seguro, una razón, de vuelta al horario"},s:{en:"Same rules as the call, shorter. Price from approved rates with what's included; answer objections in two lines; offer a smaller scope instead of a discount; end with the two slots.",es:"Mismas reglas que la llamada, más corto. Precio desde tarifas aprobadas con lo incluido; objeciones en dos líneas; alcance menor en vez de descuento; termina con los dos horarios."},ex:[T("How much?"),Y("For a 3/2 deep clean it's [rate], everything included, bathrooms, kitchen, baseboards, floors, supplies. Want Thursday 9 or Saturday 1?"),T("That's a lot."),Y("Totally fair, a deep clean covers everything that's built up. A standard clean is [rate]; we can add just the bathrooms deep-cleaned for [rate]. Which do you prefer?"),T("Got a cheaper quote."),Y("Usually a different scope, fewer hours or supplies not included. Ours is the full list, insured team, and we come back if anything's missed. Thursday or Saturday?"),T("Let me ask my wife."),Y("Of course! Here's the quote in writing: [rate], includes [scope]. I'll hold Thursday 9 until tomorrow, just reply YES to lock it.")],a:{en:"Discount by text · arguing · leaving the thread without a slot.",es:"Descuento por texto · discutir · dejar el hilo sin horario."},x:{en:"YES → booked; silence → one follow-up tomorrow.",es:"SÍ → reservado; silencio → un seguimiento mañana."}},
{n:{en:"Reminders, day of, review",es:"Recordatorios, el día, reseña"},t:{en:"The texts that protect the sale",es:"Los textos que protegen la venta"},s:{en:"Reminder the day before, on-the-way text, done text with the review link, and a “fix it” promise. This is what turns one booking into a recurring client.",es:"Recordatorio el día anterior, texto en camino, texto al terminar con el enlace de reseña y la promesa de “lo arreglamos”. Esto convierte una reserva en un cliente recurrente."},ex:[Y("Hi [Name], reminder: [Company] tomorrow at 9. Please leave the alarm off, reply if anything changed!"),Y("Team's on the way, about 20 min out."),Y("All done, [Name]! Thanks for having us. If everything looked great: [review link]. Anything not right, tell me and we fix it."),Y("Hi [Name], two weeks since the deep clean, want me to set up biweekly so it stays that way? Every other [day], [rate]. Reply YES and I'll confirm."),Y("Hi [Name], if a neighbor or friend could use us, we'd love an intro, and you get [referral perk, if offered] on your next clean.")],a:{en:"No reminder · asking for the review a week later.",es:"Sin recordatorio · pedir la reseña una semana después."},x:{en:"Recurring → referral.",es:"Recurrente → referido."}},
{n:{en:"Reactivation by text",es:"Reactivación por texto"},t:{en:"Old quotes, past customers, seasons",es:"Cotizaciones viejas, clientes pasados, temporadas"},s:{en:"Reference their original request or last service, give a real reason, offer two dates. One text, one follow-up, then leave it for next season.",es:"Referencia su solicitud original o el último servicio, da una razón real, ofrece dos fechas. Un texto, un seguimiento, y luego déjalo para la próxima temporada."},ex:[Y("Hi [Name], it's [Name] with [Company]. You asked about a deep clean back in June, still something you'd like? I have Thursday or Saturday this week."),Y("Hi [Name], we did your move-in clean in March. Holiday season's booking up, want a deep clean the week of the 15th, or biweekly through December?"),Y("Hi [Name], spring-clean spots are going fast. Same team as last time, [rate]. Second week of April work?")],a:{en:"Texting old leads every week · “just checking in”.",es:"Textear a leads viejos cada semana · “solo para saludar”."},x:{en:"Booked, or next-season date in the CRM.",es:"Reservado, o fecha de próxima temporada en el CRM."}}]};

const WORDS={
tips:[
{n:{en:"Why it matters",es:"Por qué importa"},t:{en:"The same answer, two different outcomes",es:"La misma respuesta, dos resultados distintos"},s:{en:"The client decides how they feel about you long before they decide about the price. Words carry that feeling. \"No problem\" tells them there was a problem. \"Absolutely, happy to\" tells them they are in good hands. Use warm, certain, partnership language, and drop the filler that makes you sound unsure. None of this is a script trick. It is the difference between sounding like someone taking an order and sounding like a professional who does this every day.",es:"El cliente decide cómo se siente contigo mucho antes de decidir sobre el precio. Las palabras cargan ese sentimiento. \"No hay problema\" le dice que había un problema. \"Claro que sí, con gusto\" le dice que está en buenas manos. Usa lenguaje cálido, seguro y de alianza, y quita el relleno que te hace sonar inseguro. Nada de esto es un truco. Es la diferencia entre sonar como alguien que toma un pedido y sonar como un profesional que hace esto todos los días."},ex:[Y("Absolutely, happy to help with that."),Y("Perfect, that gives me exactly what I need."),Y("Great question, and an important one."),Y("Excellent, let's get you on the schedule.")],a:{en:"Sorry to bother you · I was just calling · hopefully · maybe we could · no problem · I'll try.",es:"Perdón por molestar · solo llamaba · ojalá · tal vez podríamos · no hay problema · voy a intentar."},x:{en:"Use them on the next call.",es:"Úsalas en la próxima llamada."}},
{n:{en:"Sounding sure",es:"Sonar seguro"},t:{en:"Certainty is contagious",es:"La seguridad se contagia"},s:{en:"Certainty is contagious. Replace soft verbs with firm ones and the client relaxes. \"I think we could probably\" becomes \"we can\". \"It's usually around\" becomes \"it's [rate]\". Say the price once, clearly, then stop talking. Confidence is not volume, it is not rushing and not apologizing.",es:"La seguridad se contagia. Cambia los verbos suaves por firmes y el cliente se relaja. \"Creo que tal vez podríamos\" se vuelve \"podemos\". \"Normalmente anda por\" se vuelve \"son [tarifa]\". Di el precio una vez, claro, y deja de hablar. La seguridad no es volumen, es no apurarse y no disculparse."},ex:[Y("We can absolutely handle that."),Y("That's exactly what we do."),Y("For a 3-bed, 2-bath deep clean it's [rate], everything included."),Y("Here's what happens next."),Y("I'll have it to you by Thursday.")],a:{en:"I think · probably · kind of · we might be able to · it depends (with nothing after it).",es:"Creo que · probablemente · más o menos · tal vez podamos · depende (sin nada después)."},x:{en:"Pair with a two-option close.",es:"Combínalas con un cierre de dos opciones."}},
{n:{en:"Talking to a business",es:"Hablarle a un negocio"},t:{en:"For commercial accounts",es:"Para cuentas comerciales"},s:{en:"Commercial buyers are not shopping for a cleaner, they are adding a vendor to their operation. Speak their language: partnership, collaborate, contribute, approved vendor, scope, frequency, standard, point of contact, walkthrough, proposal, service agreement, quality inspection, reporting. It signals that you have done this with companies like theirs.",es:"El comprador comercial no busca un limpiador, está agregando un proveedor a su operación. Habla su idioma: alianza, colaborar, contribuir, vendor aprobado, alcance, frecuencia, estándar, punto de contacto, walkthrough, propuesta, acuerdo de servicio, inspección de calidad, reportes. Eso indica que ya hiciste esto con empresas como la suya."},ex:[Y("We'd love the opportunity to build a partnership with your team."),Y("How does your team typically evaluate new vendors?"),Y("I want to make sure the scope reflects your standard, not a guess."),Y("You'd have one point of contact, and a quality inspection on a set schedule."),Y("Happy to contribute whatever documentation your approval process requires.")],a:{en:"Cheap · guys · we'll send somebody · deal · I'll give you a good price.",es:"Barato · los muchachos · le mando a alguien · trato · le doy un buen precio."},x:{en:"Use in openings and proposals.",es:"Úsalas en aperturas y propuestas."}},
{n:{en:"Talking to a homeowner",es:"Hablarle a un dueño de casa"},t:{en:"For homeowners",es:"Para dueños de casa"},s:{en:"A homeowner is letting strangers into their house. The words that win are about safety and relief, not about equipment. Insured, background-checked, trained, same team, take care of, peace of mind, guarantee, we'll come back, you don't have to think about it. Say the team's name if you can. Mention the pet by name.",es:"Un dueño de casa está dejando entrar desconocidos a su hogar. Las palabras que ganan son de seguridad y alivio, no de equipo. Asegurados, con verificación de antecedentes, capacitados, el mismo equipo, cuidar de, tranquilidad, garantía, regresamos, no tiene que pensar en eso. Di el nombre del equipo si puedes. Menciona a la mascota por su nombre."},ex:[Y("Our team is insured and background-checked, and you'd have the same crew each time."),Y("We'll take care of it so you don't have to think about it."),Y("If anything isn't right, you call me and we come back. That's the guarantee."),Y("Maria and Ana will be your team, and they're great with dogs.")],a:{en:"Girls · the maid · we'll squeeze you in · it should be fine · we'll see what we can do.",es:"Las muchachas · la sirvienta · lo encajamos · debería estar bien · veremos qué podemos hacer."},x:{en:"Use before you say the price.",es:"Úsalas antes de decir el precio."}},
{n:{en:"Keeping them talking",es:"Mantenerlos hablando"},t:{en:"Small responses that keep them talking",es:"Respuestas cortas que los mantienen hablando"},s:{en:"While the client is talking, short warm responses do more than any pitch. They signal you are listening and they buy you more information. Use them, then stay quiet and let the person continue.",es:"Mientras el cliente habla, respuestas cortas y cálidas hacen más que cualquier pitch. Indican que estás escuchando y te compran más información. Úsalas y luego quédate callado para que la persona siga."},ex:[Y("That makes sense."),Y("I hear you."),Y("That's completely fair."),Y("Good, that helps."),Y("Tell me more about that."),Y("Understood, thank you for explaining it.")],a:{en:"Right right right · uh huh · interrupting to agree · finishing their sentence.",es:"Sí sí sí · ajá · interrumpir para estar de acuerdo · terminarles la frase."},x:{en:"Follow with an open question.",es:"Sigue con una pregunta abierta."}},
{n:{en:"Moving to the close",es:"Avanzar al cierre"},t:{en:"Move them forward without pressure",es:"Avanzar sin presionar"},s:{en:"A good close sounds like the next logical thing, not like a request. Use \"let's\", \"the next step is\", \"I'll\", and always give two choices instead of a yes or no question. Confirm out loud what you both agreed so it becomes real.",es:"Un buen cierre suena a lo siguiente lógico, no a una petición. Usa \"vamos a\", \"el siguiente paso es\", \"yo me encargo de\", y siempre da dos opciones en vez de una pregunta de sí o no. Confirma en voz alta lo que acordaron para que se vuelva real."},ex:[Y("Let's get you on the schedule."),Y("The next step is a quick walkthrough so the proposal fits the building."),Y("Would Thursday at 9 or Saturday at 1 work better?"),Y("Perfect. So we're set for Thursday at 9, and I'll text the confirmation now."),Y("I'll have it to you by Thursday and we'll review it together Friday at 2.")],a:{en:"Would you like to hire us · let me know · whenever you're ready · think about it and call me.",es:"¿Quiere contratarnos? · avíseme · cuando esté listo · piénselo y me llama."},x:{en:"Confirm and put it in the CRM.",es:"Confirma y ponlo en el CRM."}},
{n:{en:"Phrases that sell",es:"Frases que venden"},t:{en:"Lines worth memorizing",es:"Frases que vale la pena memorizar"},s:{en:"A handful of sentences do most of the work in a sales conversation. They open a story, they buy you time, they make a price feel fair, and they turn a maybe into a date. Learn these until they come out without thinking, then adapt them to the property in front of you.",es:"Un puñado de frases hacen casi todo el trabajo en una conversación de venta. Abren una historia, te compran tiempo, hacen que un precio se sienta justo y convierten un tal vez en una fecha. Apréndelas hasta que salgan sin pensar y luego adáptalas a la propiedad que tengas enfrente."},ex:[Y("Tell me what's going on with the cleaning right now."),Y("What made you start looking?"),Y("What would it mean for you if that were solved?"),Y("It sounds like consistency is the real issue here. Is that fair?"),Y("Just so I understand: [their words]. Did I get that right?"),Y("Based on what you've shared, here's what I'd recommend."),Y("I'd rather give you an accurate number than a guess."),Y("What's included in what you're comparing?"),Y("Here's what happens next."),Y("Would Thursday at 9 or Saturday at 1 work better?"),Y("So we're set for Thursday. I'll send the confirmation now."),Y("If anything isn't right, you call me and we come back.")],a:{en:"Reciting them in a row like a script. Use one at a time, where it fits.",es:"Recitarlas seguidas como un guion. Usa una a la vez, donde encaje."},x:{en:"Pick three for this week.",es:"Elige tres para esta semana."}},
{n:{en:"Sounding like an expert",es:"Sonar como experto"},t:{en:"Recommend, don't ask what they want",es:"Recomienda, no preguntes qué quieren"},s:{en:"The fastest way to sound like a professional is to make a recommendation and explain why, instead of handing over a menu. Reference what you have seen in similar properties, name what you noticed, and give a reason for every suggestion. Experts are specific: they say which areas, how often, and what happens if it waits.",es:"La forma más rápida de sonar profesional es hacer una recomendación y explicar por qué, en vez de entregar un menú. Referencia lo que has visto en propiedades parecidas, nombra lo que notaste y da una razón para cada sugerencia. Los expertos son específicos: dicen qué áreas, cada cuánto y qué pasa si se deja pasar."},ex:[Y("Based on what you've described, I'd start with a deep clean and then move to biweekly. Here's why."),Y("In buildings this size we usually see the restrooms drive most of the complaints, so that's where I'd put the detail."),Y("With that much foot traffic, the entrance mats and the entry glass are what people notice first."),Y("Most medical offices we work with run a nightly service with a heavier detail once a week."),Y("If the floors wait another season, you'll be paying for restoration instead of maintenance."),Y("I've done a few move-outs in that complex. The landlords there always check inside the cabinets and the oven.")],a:{en:"What package would you like? · We can do whatever you need · It's up to you.",es:"¿Qué paquete le gustaría? · Hacemos lo que necesite · Usted dirá."},x:{en:"Recommend, then price.",es:"Recomienda, luego cotiza."}},
{n:{en:"Property management",es:"Property management"},t:{en:"Turnovers, common areas, complaints",es:"Turnovers, áreas comunes, quejas"},s:{en:"Property managers live between residents and owners. The words that land are the ones about fewer complaints, units ready on time, and one person to call. Their vocabulary: turnover, make-ready, move-in and move-out, unit inspection, common areas, amenity areas, breezeways, work order, vacancy, CAM, leasing office, regional manager, portfolio, per-door pricing, after-hours emergency.",es:"El property manager vive entre residentes y dueños. Las palabras que aterrizan son las de menos quejas, unidades listas a tiempo y una sola persona a quien llamar. Su vocabulario: turnover, make-ready, move-in y move-out, inspección de unidad, áreas comunes, áreas de amenidades, breezeways, work order, vacancy, CAM, oficina de leasing, regional manager, portafolio, precio por puerta, emergencia after-hours."},ex:[Y("How many turnovers do you average in a month, and what's your make-ready window?"),Y("Are we talking common areas only, or units as well?"),Y("Who handles the work orders, the leasing office or maintenance?"),Y("What are residents complaining about most right now?"),Y("If it works here, would the same standard apply across the portfolio?"),Y("You'd have one point of contact, so nobody in the office has to chase a crew.")],a:{en:"Talking about square feet when they think in doors and units.",es:"Hablar de pies cuadrados cuando ellos piensan en puertas y unidades."},x:{en:"One property first, then the portfolio.",es:"Una propiedad primero, luego el portafolio."}},
{n:{en:"Clinics and medical offices",es:"Clínicas y consultorios"},t:{en:"Protocol, detail, and discretion",es:"Protocolo, detalle y discreción"},s:{en:"In a clinic the buyer is worried about two things: what a patient sees and what an inspector sees. Speak in protocols and consistency, never in shortcuts. Their vocabulary: exam rooms, treatment rooms, waiting area, reception, terminal clean, high-touch disinfection, dwell time, color-coded microfiber, cross-contamination, OSHA, compliance, biohazard and sharps (handled by their staff, never by us), after-patient hours, badge or key access, confidentiality.",es:"En una clínica al comprador le preocupan dos cosas: lo que ve un paciente y lo que ve un inspector. Habla de protocolos y consistencia, nunca de atajos. Su vocabulario: exam rooms, salas de tratamiento, sala de espera, recepción, terminal clean, desinfección de alto contacto, tiempo de contacto del químico, microfibra por color, contaminación cruzada, OSHA, compliance, biohazard y punzocortantes (los maneja su personal, nunca nosotros), horario después de pacientes, acceso con badge o llave, confidencialidad."},ex:[Y("Would you want the exam rooms on a terminal clean protocol, or standard nightly with high-touch disinfection?"),Y("We use color-coded microfiber so nothing crosses between restrooms, exam rooms and the break room."),Y("What time do the last patients leave, and is there badge access after hours?"),Y("Does your compliance team require documentation of the products we use?"),Y("Anything involving sharps or biohazard stays with your staff. We work around it and document it."),Y("Waiting areas are what patients judge you on, so that's where we hold the detail every night.")],a:{en:"Promising anything about medical waste, or naming a protocol you cannot execute.",es:"Prometer algo sobre desechos médicos o nombrar un protocolo que no puedes ejecutar."},x:{en:"Confirm protocol and access, then walkthrough.",es:"Confirma protocolo y acceso, luego walkthrough."}},
{n:{en:"Post-construction",es:"Post-construcción"},t:{en:"Phases, dates, and condition",es:"Fases, fechas y condición"},s:{en:"On a construction site the conversation is about the schedule, not about cleaning. Know the phases and say them correctly: rough clean during the build, final clean before handover, touch-up or fluff clean after punch list. Their vocabulary: punch list, substantial completion, certificate of occupancy, superintendent, subcontractor, change order, phases, debris removal, dust control, protective film, window sticker and label removal, scope walk, turnover date, crew size, night shift. Price after you know the phase and the condition, never before.",es:"En una obra la conversación es sobre el cronograma, no sobre limpieza. Conoce las fases y dilas bien: rough clean durante la obra, final clean antes de la entrega, touch-up o fluff clean después del punch list. Su vocabulario: punch list, substantial completion, certificate of occupancy, superintendente, subcontratista, change order, fases, retiro de escombros, control de polvo, película protectora, retiro de stickers y etiquetas de ventanas, scope walk, fecha de entrega, tamaño de cuadrilla, turno de noche. Cotiza después de conocer la fase y la condición, nunca antes."},ex:[Y("Are we talking rough clean, final clean, or the touch-up after punch list?"),Y("What's the substantial completion date you're working toward?"),Y("Who's the superintendent I should coordinate with on site?"),Y("Is debris removal on us, or is there a dumpster and a haul-off already?"),Y("Are windows getting sticker and label removal, and is the protective film still on?"),Y("If the schedule slides a week, we can move the crew. What's your turnover date?"),Y("How many crews do you want on it, and is night shift an option to stay ahead of the trades?")],a:{en:"Quoting a final clean without walking the site or knowing the phase.",es:"Cotizar un final clean sin recorrer el sitio ni saber la fase."},x:{en:"Scope walk, then price by phase.",es:"Scope walk, luego precio por fase."}},
{n:{en:"Offices and facilities",es:"Oficinas e instalaciones"},t:{en:"Terms that show you belong in the conversation",es:"Términos que muestran que perteneces a la conversación"},s:{en:"Janitorial, day porter, after-hours service, scope of work, frequency, square footage, common areas, high-touch points, floor care (strip and wax, scrub, burnishing), consumables, COI, W-9, certificate of insurance, vendor registration, procurement, compliance portal, RFP or bid, service agreement, quality inspection, SLA, badge access, supervisor walk.",es:"Janitorial, day porter, servicio after-hours, scope of work, frecuencia, square footage, áreas comunes, puntos de alto contacto, floor care (strip and wax, scrub, burnishing), consumibles, COI, W-9, certificado de seguro, registro de vendor, procurement, portal de compliance, RFP o bid, acuerdo de servicio, inspección de calidad, SLA, acceso con badge, recorrido del supervisor."},ex:[Y("What frequency are you running today, and does that include common areas?"),Y("Would you want a day porter during business hours, or after-hours only?"),Y("We can send the COI and W-9 today. Does your approval process need anything else?"),Y("Is there a supervisor walk or quality inspection your team expects, and how often?")],a:{en:"Guessing at a term you do not know. Ask instead: \"When you say punch list, what's included on your end?\"",es:"Adivinar un término que no conoces. Mejor pregunta: \"Cuando dice punch list, ¿qué incluye de su lado?\""},x:{en:"Use one or two, not all of them.",es:"Usa una o dos, no todas."}},
{n:{en:"Residential terms",es:"Términos residenciales"},t:{en:"Plain words, no industry jargon",es:"Palabras simples, sin jerga"},s:{en:"With homeowners, drop the industry terms. Say deep clean, standard or maintenance clean, move-in and move-out, recurring, weekly, biweekly, monthly, add-ons, baseboards, inside the oven, inside the fridge, interior windows, pet hair, high dusting, ceiling fans, detailed bathrooms. Describe what they will see when they walk in, not what your team will do.",es:"Con dueños de casa, deja la jerga. Di deep clean, limpieza estándar o de mantenimiento, move-in y move-out, recurrente, semanal, quincenal, mensual, extras, zócalos, dentro del horno, dentro del refrigerador, ventanas interiores, pelo de mascota, polvo alto, ventiladores de techo, baños detallados. Describe lo que van a ver al entrar, no lo que va a hacer tu equipo."},ex:[Y("A deep clean is the full reset: bathrooms detailed, kitchen including inside the microwave, baseboards, high dusting, floors."),Y("After that, most families do biweekly to keep it there."),Y("Inside the oven and inside the fridge are add-ons if you want them."),Y("With two dogs I'd add the pet hair treatment, that's where people notice the difference.")],a:{en:"Scope of work · SLA · consumables · janitorial. Save those for commercial.",es:"Scope of work · SLA · consumibles · janitorial. Eso es para comercial."},x:{en:"Recommend, then price.",es:"Recomienda, luego cotiza."}},
{n:{en:"Retail, hospitality, industrial",es:"Retail, hospitalidad, industrial"},t:{en:"Guest-facing and safety-first",es:"Cara al cliente y seguridad primero"},s:{en:"Retail and hospitality buyers think in terms of what the customer sees and when the doors open. Their vocabulary: front of house, back of house, opening and closing, guest-facing, fitting rooms, restroom checks, floor care program, entry mats, lobby, peak hours. Industrial and warehouse buyers think in terms of safety and scale: PPE, safety orientation, dock, aisles, racking, scrubber, sweeper, pressure washing, shift schedule, lockout areas, high bay, spill response.",es:"En retail y hospitalidad piensan en lo que ve el cliente y a qué hora abren. Su vocabulario: front of house, back of house, apertura y cierre, áreas de cara al cliente, probadores, revisiones de baños, programa de floor care, tapetes de entrada, lobby, horas pico. En industrial y bodega piensan en seguridad y escala: PPE, orientación de seguridad, dock, pasillos, racking, scrubber, barredora, pressure washing, horario por turno, áreas restringidas, high bay, respuesta a derrames."},ex:[Y("Do you want us finishing before you open, or working around peak hours?"),Y("How often do you want restroom checks during the day?"),Y("Is the floor care on a program, or only when it starts to show?"),Y("Does your site require PPE or a safety orientation before our crew starts?"),Y("How many shifts are running, and when is the dock quiet enough to work around?")],a:{en:"Scheduling a retail deep clean during business hours without asking.",es:"Programar una limpieza profunda de retail en horario de atención sin preguntar."},x:{en:"Match the schedule to their hours.",es:"Ajusta el horario al suyo."}},
{n:{en:"Say this instead",es:"Di esto mejor"},t:{en:"Habits worth dropping",es:"Costumbres que conviene dejar"},s:{en:"No problem becomes absolutely, happy to. I'll try becomes I'll have it to you by Thursday. It's kind of expensive becomes the investment is [rate] and here is what it covers. Sorry to bother you becomes I was hoping you could help me with something. Cheap becomes affordable or the right fit for the budget. Cheaper than them becomes a different scope, let me show you what's included. Let me know becomes would Thursday or Friday work better. Contract becomes service agreement. Salesperson becomes your point of contact.",es:"No hay problema se vuelve claro que sí, con gusto. Voy a intentar se vuelve lo tendrá el jueves. Está algo caro se vuelve la inversión es [tarifa] y esto es lo que cubre. Perdón por molestar se vuelve esperaba que me pudiera ayudar con algo. Barato se vuelve accesible o el ajuste correcto para el presupuesto. Más barato que ellos se vuelve un alcance distinto, le muestro qué incluye. Avíseme se vuelve ¿le queda mejor jueves o viernes? Contrato se vuelve acuerdo de servicio. Vendedor se vuelve su punto de contacto."},ex:[Y("Absolutely, happy to take care of that."),Y("I'll have the proposal to you by Thursday at noon."),Y("The investment is [rate], and that includes [scope]."),Y("I was hoping you could help me with something."),Y("Would Thursday or Friday work better for a quick call?")],a:{en:"Filler that makes you sound unsure: just, hopefully, maybe, I guess, if that's okay.",es:"Relleno que te hace sonar inseguro: solo, ojalá, tal vez, supongo, si le parece."},x:{en:"Pick three and use them today.",es:"Elige tres y úsalas hoy."}}]};

const LS=(k,d)=>{try{return localStorage.getItem("playbook:"+k)||d}catch(e){return d}};const SS=(k,v)=>{try{localStorage.setItem("playbook:"+k,v)}catch(e){}};
let tab=LS("tab","ib"),screen=LS("screen","welcome"),step=+LS("step",0);let seg=LS("seg","com");
const say=o=>`<div class="say"><span class="who">${t(UI[o.who])}</span>${esc(o.s)}<button class="copy" data-copy="${esc(o.s)}">COPY</button></div>`;
function welcomeHTML(){return INTRO[lang]+`<div class="big"><button data-start="com"><b>${t(UI.com)}</b><span>${lang==="es"?"Oficinas, propiedades, contratistas, post-construcción. Se cierra por pasos: walkthrough, propuesta, revisión.":"Offices, properties, contractors, post-construction. Closes in steps: walkthrough, proposal, review."}</span></button><button data-start="res"><b>${t(UI.res)}</b><span>${lang==="es"?"Casas y departamentos. Se cierra en la misma llamada: recomendar, cotizar, reservar.":"Homes and apartments. Closes on the same call: recommend, price, book."}</span></button></div><p class="hint">${lang==="es"?"O revisa primero":"Or start with"} <button class="btn ghost" data-start="words" style="padding:3px 9px;min-height:26px">${t(UI.words)}</button></p>`}
function render(){$$("[data-t]").forEach(el=>el.innerHTML=t(UI[el.dataset.t]));$("#lang").textContent=lang==="es"?"EN":"ES";$("#home").textContent=t(UI.start);$("#q").placeholder=t(UI.search);
 if(screen==="welcome"){$("#welcome").innerHTML='<div class="intro">'+welcomeHTML()+'</div>';$("#welcome").hidden=false;$("#app").hidden=true;$("#expand").hidden=true;return}
 $("#welcome").hidden=true;$("#app").hidden=false;$("#expand").hidden=false;
 $("#crumb").innerHTML=`<button data-start="back">${t(UI.start)}</button><span>›</span><b>${t(UI[seg==="words"?"words":seg])}</b><span>›</span><b>${t(TABS.find(x=>x[0]===tab)[1])}</b>`;
 $("#tabs").innerHTML=TABS.map(([id,n])=>`<button data-tab="${id}" class="${id===tab?"on":""}">${t(n)}</button>`).join("");
 $("#tabs").hidden=false;list()}
function items(){if(seg==="words"||tab==="words")return WORDS.tips;return (seg==="res"?R[tab]:D[tab])||[]}
function list(){const q=$("#q").value.trim().toLowerCase();const all=items();const sel=all.filter(it=>!q||[t(it.n),t(it.t),t(it.s),t(it.a),...it.ex.map(e=>e.s)].join(" ").toLowerCase().includes(q));
 $("#stepbar").innerHTML=q?"":all.map((it,i)=>`<button data-step="${i}" class="${i===step?"on":""}"><i>${i+1}</i>${esc(t(it.n))}</button>`).join("");
 $("#list").innerHTML=sel.map((it,i)=>{const idx=all.indexOf(it);const open=q?true:idx===step;return `<details class="it" id="it${idx}" ${open?"open":""}><summary><div><span class="n">${seg==="words"?esc(t(it.n)):`${t(UI.step)} ${idx+1} ${t(UI.of)} ${all.length} · ${esc(t(it.n))}`}</span><b>${esc(t(it.t))}</b></div></summary><div class="in"><div class="strat">${esc(t(it.s))}</div><div class="lbl">${t(UI.examples)}</div>${it.ex.map(say).join("")}<div class="lbl">${t(UI.avoid)}</div><div class="avoid">${esc(t(it.a))}</div><div class="nba"><b>${t(UI.next)}</b>${esc(t(it.x))}</div>${!q&&idx<all.length-1?`<div style="margin-top:10px"><button class="btn d" data-step="${idx+1}">${t(UI.nextstep)}: ${esc(t(all[idx+1].n))} →</button></div>`:""}</div></details>`}).join("")||`<p class="hint" style="padding:14px 0">, </p>`}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;step=0;SS("tab",tab);SS("step",0);render();window.scrollTo(0,0)};
$("#q").oninput=list;
document.addEventListener("click",e=>{const st=e.target.closest("[data-start]");if(st){const v=st.dataset.start;if(v==="back"){screen="welcome"}else if(v==="words"){if(seg==="words")seg="com";tab="words";screen="app";SS("tab",tab)}else{seg=v;screen="app";SS("seg",seg);if(!TABS.find(x=>x[0]===tab)||tab==="words")tab="ib"}step=0;SS("screen",screen);SS("step",0);render();window.scrollTo(0,0);return}
 const sp=e.target.closest("[data-step]");if(sp){step=+sp.dataset.step;SS("step",step);list();const el=$("#it"+step);if(el)el.scrollIntoView({block:"start"});return}});
$("#home").onclick=()=>{screen="welcome";SS("screen","welcome");render();window.scrollTo(0,0)};
$("#lang").onclick=()=>{lang=lang==="es"?"en":"es";try{localStorage.setItem("playbook:lang",lang)}catch(e){}render()};
$("#expand").onclick=()=>{const open=$$("details.it").some(d=>!d.open);$$("details.it").forEach(d=>d.open=open);$("#expand").textContent=open?t(UI.collapse):t(UI.expand)};
document.addEventListener("click",async e=>{const c=e.target.closest(".copy");if(!c)return;try{await navigator.clipboard.writeText(c.dataset.copy)}catch(x){const ta=document.createElement("textarea");ta.value=c.dataset.copy;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(y){}ta.remove()}c.textContent="COPIED";c.classList.add("ok");setTimeout(()=>{c.textContent="COPY";c.classList.remove("ok")},1200)});
render();
</script>
</body>
</html>
