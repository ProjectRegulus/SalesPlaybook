<title>Sales Playbook</title>
<style>

header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--ink);flex-wrap:wrap}
h1{font-size:15px;margin:0;letter-spacing:.06em;text-transform:uppercase}h1 small{display:block;font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--g2)}
h2{font-size:20px;margin:18px 0 6px}h3{font-size:12px;margin:0;letter-spacing:.1em;text-transform:uppercase;color:var(--g1)}
p{margin:0 0 10px}.lead{color:var(--g1)}.hint{font-size:12.5px;color:var(--g2)}

.seg{display:flex;border:1px solid var(--ink);border-radius:var(--r);overflow:hidden;margin:8px 0 0}.seg button{flex:1;border:0;background:var(--w);padding:9px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.seg button.on{background:var(--ink);color:var(--w)}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--g2);border:1px solid var(--g4);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle}

.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:8px 0 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}.flow span{border:1px solid var(--g3);border-radius:4px;padding:3px 7px}.flow i{color:var(--g2);font-style:normal}
details.it{border-top:1px solid var(--g4)}details.it:last-child{border-bottom:1px solid var(--g4)}
summary{cursor:pointer;padding:12px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}summary::-webkit-details-marker{display:none}summary:after{content:"+";color:var(--g2);font-weight:400;flex:none}details[open] summary:after{content:"–"}
summary b{font-size:15px}summary .n{font-size:11px;letter-spacing:.1em;color:var(--g2);text-transform:uppercase;display:block}
.in{padding:0 0 14px}
.strat{border-left:2px solid var(--g3);padding:6px 12px;margin:0 0 10px;color:var(--g1);font-size:14px}

.say .who{display:block;font-style:normal;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--g2);margin-bottom:2px}
.copy{border:1px solid var(--g3);background:var(--w);border-radius:4px;padding:4px 9px;font-size:11px;font-weight:600;letter-spacing:.06em;font-style:normal}.copy.ok{background:var(--ink);color:var(--w);border-color:var(--ink)}
.avoid{font-size:13px;color:var(--g1)}.avoid b{color:var(--ink)}
.nba{background:var(--ink);color:var(--w);border-radius:var(--r);padding:8px 12px;font-size:13px;margin-top:8px}.nba b{color:var(--g3);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;display:block}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--w);padding:8px 14px;border-radius:var(--r);font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}
footer{margin-top:30px;padding-top:10px;border-top:1px solid var(--g4);font-size:12px;color:var(--g2)}
@media(max-width:560px){.tabs{grid-template-columns:repeat(2,1fr)}.big{grid-template-columns:1fr}.say{padding-right:14px;padding-bottom:40px}.say .copy{top:auto;bottom:8px}}

<header><h1 data-t="title">Sales Playbook<small data-t="sub">Calls · Email · SMS · LinkedIn</small></h1><div style="display:flex;gap:6px"><button class="btn ghost" id="home">Start</button><button class="btn ghost" id="lang">ES</button><button class="btn ghost" id="expand" data-t="expand">Expand all</button></div></header>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang=(()=>{try{return localStorage.getItem("playbook:lang")||"en"}catch(e){return"en"}})();
const t=o=>typeof o==="string"?o:(o[lang]||o.en);
const UI={title:{en:"Sales Playbook",es:"Playbook de Ventas"},sub:{en:"Calls · Email · SMS · LinkedIn",es:"Llamadas · Email · SMS · LinkedIn"},expand:{en:"Expand all",es:"Abrir todo"},collapse:{en:"Collapse all",es:"Cerrar todo"},search:{en:"Search: price, email, gatekeeper, walkthrough…",es:"Buscar: precio, email, recepción, walkthrough…"},strategy:{en:"Strategy",es:"Estrategia"},examples:{en:"Examples",es:"Ejemplos"},avoid:{en:"Avoid",es:"Evita"},next:{en:"Next step",es:"Siguiente paso"},you:{en:"You",es:"Tú"},com:{en:"Commercial",es:"Comercial"},res:{en:"Residential",es:"Residencial"},both:{en:"Both",es:"Ambos"},words:{en:"How to say it",es:"Cómo decirlo"},start:{en:"Start",es:"Inicio"},step:{en:"Step",es:"Paso"},of:{en:"of",es:"de"},nextstep:{en:"Next",es:"Siguiente"},them:{en:"Them",es:"Cliente"},foot:{en:"Scripts stay in English, that's what the client hears. Explanations switch with the language button. [Name], [Company], [Area] are placeholders.",es:"Los scripts se quedan en inglés, es lo que escucha el cliente. Las explicaciones cambian con el botón de idioma. [Name], [Company], [Area] son marcadores."}};
const INTRO={en:`<h3>Before you pick up the phone</h3><p style="margin-top:6px">Every call, email or text has the same job: find out what the client actually needs, understand it well, and recommend the right thing. Most deals are not lost on price, they are lost because someone presented before they understood.</p>
<h3 style="margin-top:14px">Four rules to keep in mind</h3><ol><li><b>Listen more than you talk.</b> Inbound: the client talks about 80% of the time. Outbound: keep yourself under 40%. If you are explaining what you offer in the first minute, you are missing the information that would have closed the sale.</li><li><b>Understand before you recommend.</b> Two or three real questions about how they operate before any solution. The recommendation then comes out of what they told you, and it lands, because it is about them.</li><li><b>Trust is built with actions.</b> Nobody believes “we are reliable”. They believe the proposal that arrives at 12 like you said and the call on Friday like you said. Every promise you keep on a call is a preview of the service.</li><li><b>Never hang up without a next step and a date.</b> Walkthrough, proposal review, follow-up call, or the service itself. Always with a day and a time, said out loud and confirmed by the client. “I'll be in touch” is where opportunities go to die.</li></ol>
<h3 style="margin-top:14px">How to ask questions</h3><p style="margin-top:6px">Start open. One question that invites the person to tell you what is going on, “Tell me a little about the building and what's happening with the cleaning right now”, usually gives you the service, the size, the problem and the reason in a single answer. Then dig into what they said (“how often?”, “what did that look like?”), repeat it back in your own words so they can correct you, and only after that use closed questions to fill in whatever is still missing: square footage, days per week, start date. Ask, then be quiet. The pause is uncomfortable for you, not for them.</p>
<h3 style="margin-top:14px">Commercial and residential are different sales</h3><p style="margin-top:6px"><b>Commercial</b> is a partnership sale: you are getting into their vendor process, walking the property, sending a proposal and reviewing it together. It closes in steps, and every step ends with a date. <b>Residential</b> is a convenience sale: the homeowner wants a clear answer, a fair price they can trust, and a day on the calendar, on this call. You recommend like the expert you are, price from your approved rates, and book it. The written quote goes out afterwards so they have it in writing.</p>
<div class="flow"><span>Connect</span><i>→</i><span>Discover</span><i>→</i><span>Qualify</span><i>→</i><span>Recommend</span><i>→</i><span>Objection</span><i>→</i><span>Next step</span><i>→</i><span>CRM</span></div>`,
es:`<h3>Antes de levantar el teléfono</h3><p style="margin-top:6px">Cada llamada, email o texto tiene el mismo trabajo: averiguar qué necesita realmente el cliente, entenderlo bien y recomendar lo correcto. La mayoría de las ventas no se pierden por precio, se pierden porque alguien presentó antes de entender.</p>
<h3 style="margin-top:14px">Cuatro reglas a tomar en cuenta</h3><ol><li><b>Escucha más de lo que hablas.</b> Inbound: el cliente habla cerca del 80% del tiempo. Outbound: mantente por debajo del 40%. Si estás explicando lo que ofreces en el primer minuto, te estás perdiendo la información que habría cerrado la venta.</li><li><b>Entiende antes de recomendar.</b> Dos o tres preguntas reales sobre cómo operan antes de cualquier solución. La recomendación sale entonces de lo que te contaron, y aterriza, porque es sobre ellos.</li><li><b>La confianza se construye con acciones.</b> Nadie cree “somos confiables”. Creen en la propuesta que llega a las 12 como dijiste y en la llamada del viernes como dijiste. Cada promesa que cumples en una llamada es un adelanto del servicio.</li><li><b>Nunca cuelgues sin un siguiente paso con fecha.</b> Walkthrough, revisión de propuesta, llamada de seguimiento o el servicio mismo. Siempre con día y hora, dicho en voz alta y confirmado por el cliente. “Estamos en contacto” es donde se mueren las oportunidades.</li></ol>
<h3 style="margin-top:14px">Cómo hacer las preguntas</h3><p style="margin-top:6px">Empieza abierto. Una sola pregunta que invite a la persona a contarte qué está pasando, “Cuénteme un poco del edificio y qué está pasando con la limpieza ahora mismo”, normalmente te da el servicio, el tamaño, el problema y el motivo en una sola respuesta. Después profundiza en lo que dijo (“¿con qué frecuencia?”, “¿cómo fue eso?”), repítelo con tus palabras para que te corrija, y solo entonces usa preguntas cerradas para llenar lo que falta: pies cuadrados, días por semana, fecha de inicio. Pregunta y guarda silencio. La pausa es incómoda para ti, no para ellos.</p>
<h3 style="margin-top:14px">Comercial y residencial son ventas distintas</h3><p style="margin-top:6px"><b>Comercial</b> es una venta de alianza: entras en su proceso de vendors, recorres la propiedad, mandas una propuesta y la revisan juntos. Se cierra por pasos, y cada paso termina con una fecha. <b>Residencial</b> es una venta de conveniencia: el dueño de casa quiere una respuesta clara, un precio justo en el que pueda confiar y un día en el calendario, en esta llamada. Recomiendas como el experto que eres, cotizas desde tus tarifas aprobadas y lo reservas. La cotización escrita sale después, para que quede documentado.</p>
<div class="flow"><span>Conectar</span><i>→</i><span>Descubrir</span><i>→</i><span>Calificar</span><i>→</i><span>Recomendar</span><i>→</i><span>Objeción</span><i>→</i><span>Siguiente paso</span><i>→</i><span>CRM</span></div>`};
const TABS=[["words",{en:"How to say it",es:"Cómo decirlo"}],["ib",{en:"Calls · Inbound",es:"Llamadas · Inbound"}],["ob",{en:"Calls · Outbound",es:"Llamadas · Outbound"}],["email",{en:"Email",es:"Email"}],["sms",{en:"SMS · LinkedIn · Other",es:"SMS · LinkedIn · Otros"}]];
const Y=s=>({who:"you",s}),T=s=>({who:"them",s});
const D={
ib:[
{n:{en:"First 30 seconds",es:"Primeros 30 segundos"},t:{en:"Answer before the 3rd ring, smiling",es:"Contesta antes del 3er timbre, sonriendo"},s:{en:"The person calling already decided to look for help, that is the most valuable call you will get all week. Pick up before the third ring, with energy, and let them tell you why they called. Don't interrupt, don't assume, and don't touch prices yet. In the first minute your only goal is that they feel they reached the right place.",es:"La persona que llama ya decidió buscar ayuda, es la llamada más valiosa que vas a recibir en la semana. Contesta antes del tercer timbre, con energía, y deja que te cuente por qué llamó. No interrumpas, no asumas y no toques el precio todavía. En el primer minuto tu único objetivo es que sienta que llegó al lugar correcto."},ex:[Y("Good morning, thank you for calling [Company]. My name is [Name]. How may I assist you today?"),T("We're looking for someone to clean our office."),Y("I'd be happy to help. Could you tell me a little more about what you're looking for, and what made you start looking now?")],a:{en:"Listing services · giving a price · interrupting · assuming every need is the same.",es:"Enumerar servicios · dar precio · interrumpir · asumir que toda necesidad es igual."},x:{en:"Let them talk, then discover.",es:"Déjalo hablar, luego descubre."}},
{n:{en:"Discover",es:"Descubrir"},t:{en:"Find the real reason for the call",es:"Encuentra el motivo real de la llamada"},s:{en:"“I need a quote” is never the whole story. Behind it there is a provider that stopped showing up, a lease that starts next month, an inspection, or a first-time buyer who has never hired a professional company. Start open, one question that invites them to tell you what is going on, then dig into what they said, repeat it back, and leave the closed questions (square footage, frequency, start date) for whatever is still missing.",es:"“Necesito una cotización” nunca es toda la historia. Detrás hay un proveedor que dejó de aparecer, un contrato que empieza el mes que viene, una inspección o alguien que nunca ha contratado una empresa profesional. Empieza abierto, una pregunta que invite a contar qué está pasando, luego profundiza en lo que dijo, repítelo, y deja las preguntas cerradas (pies cuadrados, frecuencia, fecha de inicio) para lo que todavía falte."},ex:[Y("Tell me a little about your facility and what's going on with the cleaning right now."),Y("What made you start looking for a cleaning company? Is this a new location, or are you replacing your current provider?"),Y("What is most important to you when choosing a cleaning company?"),Y("What has been the biggest challenge with your current service?"),T("They keep missing scheduled cleanings."),Y("How often does that happen? And how has that affected your staff or tenants?"),Y("It sounds like reliability is the real issue. Is that fair?"),Y("Last two things so I can size it: roughly how many square feet, and how many nights a week?")],a:{en:"Presenting the solution the moment you hear a problem. Changing the topic. Opening with “how many square feet?”.",es:"Presentar la solución apenas oyes un problema. Cambiar de tema. Abrir con “¿cuántos sq ft?”."},x:{en:"Confirm what you understood.",es:"Confirma lo que entendiste."}},
{n:{en:"Confirm",es:"Confirmar"},t:{en:"Repeat it back before you move on",es:"Repítelo antes de avanzar"},s:{en:"Before you go any further, say back what you understood in one or two sentences. It costs you ten seconds, it shows you were listening, and it gives the client the chance to correct a detail that would have made the whole proposal wrong. It is also the natural bridge into the qualifying questions.",es:"Antes de seguir, di en una o dos frases lo que entendiste. Te cuesta diez segundos, demuestra que estabas escuchando y le da al cliente la oportunidad de corregir un detalle que habría dejado toda la propuesta mal. También es el puente natural hacia las preguntas de calificación."},ex:[Y("Just to make sure I understand: you're looking for recurring office cleaning because your current provider has become inconsistent, communication has been difficult, and you need someone more reliable. Is that correct?"),Y("It sounds like consistency is the real issue here.")],a:{en:"Skipping straight to the pitch.",es:"Saltar directo al pitch."},x:{en:"Qualify.",es:"Califica."}},
{n:{en:"Qualify",es:"Calificar"},t:{en:"Is there a real opportunity?",es:"¿Hay una oportunidad real?"},s:{en:"Not every call is a deal. Before you present anything, make sure of the basics: the property is inside your service area, it is a service you actually do, there is real timing, you know who makes the decision, and you know whether it needs a walkthrough or can be quoted directly. Ask about budget only after they have told you what matters to them.",es:"No toda llamada es una venta. Antes de presentar algo, asegúrate de lo básico: la propiedad está dentro de tu área, es un servicio que realmente haces, hay un timing real, sabes quién toma la decisión y sabes si necesita walkthrough o se puede cotizar directo. Pregunta por presupuesto solo después de que te hayan dicho qué les importa."},ex:[Y("Who else would be involved in making this decision?"),Y("When would you ideally like the service to start?"),Y("Is there a budget range you're working with, or are you still evaluating options?"),Y("Would it be helpful for us to walk the property before preparing the proposal?")],a:{en:"Presenting to someone who doesn't decide.",es:"Presentar a alguien que no decide."},x:{en:"Present only what solves what they said.",es:"Presenta solo lo que resuelve lo que dijeron."}},
{n:{en:"Price asked early",es:"Piden precio muy pronto"},t:{en:"Price is part of discovery",es:"El precio es parte del descubrimiento"},s:{en:"Some clients ask for the price in the second minute. Don't dodge it, that sounds evasive, and don't throw out a number either, because a number without scope is a guess you will have to defend later. Say you are glad to talk pricing, ask how they price it today and what is included, get the minimum scope, and then either quote from approved rates or move to the walkthrough for an exact number.",es:"Hay clientes que piden el precio en el segundo minuto. No lo esquives, suena evasivo, pero tampoco sueltes un número, porque un número sin alcance es una adivinanza que vas a tener que defender después. Di que con gusto hablas de precio, pregunta cómo lo cotizan hoy y qué incluye, consigue el alcance mínimo, y entonces cotiza desde tarifas aprobadas o pasa al walkthrough para el número exacto."},ex:[T("How much do you charge?"),Y("I'd be happy to talk pricing. Before I do, let me ask a few questions so I'm giving you a number that actually makes sense for your facility."),Y("Do you already have a budget or a rate you're working with? What's included in that?"),Y("I'd rather give you an accurate number than a guess, a quick walkthrough gets you an exact proposal. Would Tuesday or Thursday work?")],a:{en:"A number without scope · promising a final price on the phone.",es:"Un número sin alcance · prometer precio final por teléfono."},x:{en:"Walkthrough or proposal with a date.",es:"Walkthrough o propuesta con fecha."}},
{n:{en:"Present",es:"Presentar"},t:{en:"Problem → Solution → Benefit",es:"Problema → Solución → Beneficio"},s:{en:"Now that you know what is bothering them, present only what fixes that. If they talked about communication, start with your point of contact. If they talked about missed nights, start with your schedule and supervision. Name the problem, explain how you handle it, describe what changes for them, and skip everything else. Credibility (insurance, experience, similar accounts) supports the story; it is not the story.",es:"Ahora que sabes qué les molesta, presenta solo lo que resuelve eso. Si hablaron de comunicación, empieza por tu punto de contacto. Si hablaron de noches perdidas, empieza por tu cronograma y supervisión. Nombra el problema, explica cómo lo manejas, describe qué cambia para ellos, y sáltate todo lo demás. La credibilidad (seguros, experiencia, cuentas similares) apoya la historia; no es la historia."},ex:[Y("Earlier you mentioned communication with your current provider has been inconsistent. One way we address that is a dedicated point of contact, so you always know who to reach."),Y("You said missed nights are the biggest issue. We work with defined schedules and supervision, so you get consistent service and fewer interruptions. Does that address the main concern?")],a:{en:"Reading the whole service list · talking about yourself for five minutes.",es:"Leer toda la lista de servicios · hablar de ti cinco minutos."},x:{en:"Handle objections or close.",es:"Maneja objeciones o cierra."}},
{n:{en:"Objections",es:"Objeciones"},t:{en:"Feel · Felt · Found",es:"Feel · Felt · Found"},s:{en:"An objection is a request for more information. Listen fully, acknowledge, answer calmly, confirm it's resolved, then advance.",es:"Una objeción es una petición de más información. Escucha completo, reconoce, responde con calma, confirma que quedó resuelta y avanza."},ex:[T("Your price is higher than the other company."),Y("I completely understand how you feel. Several of our clients initially felt the same way. What they found was that choosing on reliability and communication saved them the problems they'd been having. Can I ask what you're comparing, same scope and frequency?"),T("I need to think about it."),Y("Of course. It sounds like you want to make the best long-term decision. Is there anything specific you'd like more clarity on before deciding?"),T("I need to talk to my partner."),Y("That makes sense. What will matter most to them? I'm happy to join a quick call with both of you."),Y("Does that answer your question?")],a:{en:"Arguing · assuming the objection disappeared · dropping the price to “fix” it.",es:"Discutir · asumir que la objeción desapareció · bajar el precio para “arreglarla”."},x:{en:"Confirm resolved → close.",es:"Confirma resuelta → cierra."}},
{n:{en:"Close",es:"Cerrar"},t:{en:"Two options, never yes/no",es:"Dos opciones, nunca sí/no"},s:{en:"You will know they are ready when they start asking about logistics: when could you start, do you need to see the property, are you insured, what documents do you need. That is the moment to stop explaining and propose the next step as the natural thing to do, with two options, so they choose between Tuesday and Thursday instead of between yes and no.",es:"Sabrás que están listos cuando empiecen a preguntar por logística: cuándo podrían empezar, necesitan ver la propiedad, están asegurados, qué documentos piden. Ese es el momento de dejar de explicar y proponer el siguiente paso como lo natural, con dos opciones, para que elijan entre martes y jueves en vez de entre sí y no."},ex:[Y("Based on everything you've shared, the next step is a quick site walkthrough so the proposal reflects your facility exactly. Would Tuesday morning or Wednesday afternoon work better?"),Y("We can certainly help with that. Would you prefer a morning or an evening schedule?"),Y("I'll prepare the proposal based on what we discussed. Would you like it by email today, or should we review it together tomorrow?")],a:{en:"“Would you like to hire us?” · fake urgency · “let me know”.",es:"“Would you like to hire us?” · urgencia falsa · “avíseme”."},x:{en:"Confirm next steps before hanging up.",es:"Confirma los próximos pasos antes de colgar."}},
{n:{en:"Before hanging up",es:"Antes de colgar"},t:{en:"Who does what, by when",es:"Quién hace qué y para cuándo"},s:{en:"Both sides leave knowing: what you'll do, what they'll do, dates, times, contact and channel. Then the CRM, before the next call.",es:"Ambos cuelgan sabiendo: qué harás tú, qué hará el cliente, fechas, horas, contacto y canal. Luego el CRM, antes de la siguiente llamada."},ex:[Y("Perfect. I'll send the proposal by 12, and I'll call you Friday at 2 to answer any questions. Is this the best number to reach you?"),Y("Many of our clients also schedule quarterly carpet cleaning to extend the life of their flooring, would it help if I included that as an option?")],a:{en:"Upselling before they said yes · leaving the next step vague.",es:"Upsell antes del sí · dejar el siguiente paso vago."},x:{en:"CRM: contact, need, pain, decision maker, next step + date.",es:"CRM: contacto, necesidad, dolor, decisor, siguiente paso + fecha."}},
{n:{en:"Why they call",es:"Por qué llaman"},t:{en:"Nobody wants a cleaning company, they want a problem gone",es:"Nadie quiere una empresa de limpieza, quieren que un problema desaparezca"},s:{en:"Keep this list in your head before you answer. The person calling has one of these going on: a provider that doesn't show up, a new property or a building just finished, an inspection coming, complaints from tenants or staff, quality problems, no internal staff left, the company grew, or the service has become late and inconsistent. Your first questions exist to find out which one. What they are buying is not floors and trash cans: it is a clean building every time, a provider who answers, fewer complaints, schedules that are kept, and not having to think about it.",es:"Ten esta lista en la cabeza antes de contestar. La persona que llama tiene alguna de estas cosas encima: un proveedor que no aparece, una propiedad nueva o un edificio recién terminado, una inspección próxima, quejas de inquilinos o empleados, problemas de calidad, ya no queda personal interno, la empresa creció, o el servicio se volvió tarde e inconsistente. Tus primeras preguntas existen para averiguar cuál. Lo que compran no son pisos y basureros: es un edificio limpio siempre, un proveedor que contesta, menos quejas, horarios que se cumplen y no tener que pensar en eso."},ex:[Y("What's been going on with the cleaning that made you pick up the phone today?"),Y("Is this a building you're taking over, or a provider that stopped working out?"),Y("When you say it's been inconsistent, what does a bad week look like?")],a:{en:"Answering as if every caller wants the same thing.",es:"Contestar como si todos los que llaman quisieran lo mismo."},x:{en:"Discover.",es:"Descubrir."}},
{n:{en:"Building trust on the call",es:"Generar confianza en la llamada"},t:{en:"Small things, all the way through",es:"Cosas pequeñas, durante toda la llamada"},s:{en:"Trust is not something you claim at the end; it is built in small moves while they talk. Let them finish their sentences. Keep a calm, even tone. Show real interest instead of automatic replies. Confirm what you understood before moving on. Watch for the words they repeat, those are the real worries. When someone feels listened to, the conversation changes on its own.",es:"La confianza no es algo que reclamas al final; se construye en gestos pequeños mientras hablan. Deja que terminen sus frases. Mantén un tono tranquilo y parejo. Muestra interés real en vez de respuestas automáticas. Confirma lo que entendiste antes de avanzar. Fíjate en las palabras que repiten, esas son las preocupaciones de verdad. Cuando alguien siente que lo escuchan, la conversación cambia sola."},ex:[Y("Go ahead, I'm listening, take your time."),Y("You've mentioned communication a couple of times. Tell me more about that."),Y("Communication?"),Y("It sounds like your biggest concern is not going through another bad experience. Is that fair?")],a:{en:"Talking more than the client · automatic replies · interrupting to present.",es:"Hablar más que el cliente · respuestas automáticas · interrumpir para presentar."},x:{en:"Confirm, then qualify.",es:"Confirma, luego califica."}},
{n:{en:"Buying signals",es:"Señales de compra"},t:{en:"Interest sounds like questions",es:"El interés suena a preguntas"},s:{en:"The client rarely says “yes, let's do it”. What they say is: when could you start, what is the next step, do you need to see the property, what documents do you need, how long does the proposal take, do you work after hours, are you insured, what if I need something extra. Every one of those means they are already picturing working with you. When you hear them, stop presenting and move to the close.",es:"El cliente casi nunca dice “sí, hagámoslo”. Lo que dice es: cuándo podrían empezar, cuál es el siguiente paso, necesitan ver la propiedad, qué documentos piden, cuánto tarda la propuesta, trabajan fuera de horario, están asegurados, qué pasa si necesito algo extra. Cada una de esas significa que ya se están imaginando trabajando contigo. Cuando las oigas, deja de presentar y pasa al cierre."},ex:[T("How soon could you start?"),Y("Usually within a week or two of the walkthrough. What start date are you working toward, is there a contract ending or an inspection driving it?"),T("Do you need to come see the place?"),Y("Yes, that's how we make sure the proposal fits the building instead of guessing. Would Tuesday morning or Wednesday afternoon work better?"),T("What if we need extra services down the road?"),Y("That's easy to add. Let's get the recurring service set first and I'll note what you'd want as options.")],a:{en:"Hearing a buying signal and continuing to present.",es:"Oír una señal de compra y seguir presentando."},x:{en:"Close with two options.",es:"Cierra con dos opciones."}},
{n:{en:"After the call · CRM",es:"Después de la llamada · CRM"},t:{en:"Record it before the next call, not at the end of the day",es:"Regístralo antes de la siguiente llamada, no al final del día"},s:{en:"Right after you hang up: contact name, company, title, phone, email, service address, type of facility, services requested, the main needs in their words, the objections that came up, the next step you agreed, the follow-up date, and the status. Do it before you take another call. A CRM that is up to date is what lets anyone on the team pick up the opportunity exactly where you left it.",es:"Apenas cuelgues: nombre del contacto, empresa, cargo, teléfono, email, dirección del servicio, tipo de instalación, servicios solicitados, las necesidades principales en sus palabras, las objeciones que salieron, el siguiente paso acordado, la fecha de seguimiento y el estado. Hazlo antes de tomar otra llamada. Un CRM al día es lo que permite que cualquiera del equipo retome la oportunidad exactamente donde la dejaste."},ex:[Y("Example note: Dana Smith, ops manager, Riverside Medical, 8,000 sq ft, 5x/week after 6pm. Provider missing nights, no answer when they call. Decides with owner Mike. Walkthrough Tue 10am. Wants weekly photo report. Objection: price vs current, compare scope. Proposal by Thu, review Fri 2pm.")],a:{en:"Leaving notes for “later” · writing activity instead of what the client said.",es:"Dejar las notas para “después” · escribir actividad en vez de lo que dijo el cliente."},x:{en:"Next call starts with an advantage.",es:"La siguiente llamada empieza con ventaja."}}],
ob:[
{n:{en:"Before dialing",es:"Antes de marcar"},t:{en:"A call is won before you dial",es:"Una llamada se gana antes de marcar"},s:{en:"Three minutes of homework change the whole call: their website, LinkedIn, Google profile, how many locations, what kind of buildings, who is likely to handle vendors, whether they have a vendor portal, and what the CRM says from last time. Out of that comes the one thing you actually need, a legitimate reason to call that you can say in a single sentence. You are not calling to sell; you are calling to find out how they bring on vendors.",es:"Tres minutos de tarea cambian toda la llamada: su sitio web, LinkedIn, perfil de Google, cuántas ubicaciones, qué tipo de edificios, quién probablemente maneja vendors, si tienen portal y qué dice el CRM de la última vez. De ahí sale lo único que realmente necesitas, una razón legítima para llamar que puedas decir en una sola frase. No llamas a vender; llamas a averiguar cómo incorporan proveedores."},ex:[Y("I couldn't find your vendor process on your website."),Y("I noticed you opened a new location in [City]."),Y("We're already approved through [portal] and I wanted to understand the next step.")],a:{en:"Dialing cold · memorizing facts instead of having a reason.",es:"Marcar en frío · memorizar datos en vez de tener una razón."},x:{en:"Open with a request for help.",es:"Abre pidiendo ayuda."}},
{n:{en:"Opening",es:"Apertura"},t:{en:"Ask for help, then be silent",es:"Pide ayuda y guarda silencio"},s:{en:"Opening by asking for help works because you are asking for information, not for a purchase. There is nothing to resist. Say who you are, say what you were looking for and couldn't find, ask them to point you in the right direction, and then don't say another word. The silence feels long to you. To them it is just a question waiting for an answer.",es:"Abrir pidiendo ayuda funciona porque pides información, no una compra. No hay nada que resistir. Di quién eres, di qué buscabas y no encontraste, pídele que te oriente, y no digas una palabra más. El silencio te parece largo a ti. Para ellos es solo una pregunta esperando respuesta."},ex:[Y("Hi, I was hoping you could help me with something. [pause] I'm with [Company]. I'm trying to find out who handles commercial cleaning vendors for your company and what the process is to become an approved vendor. [silence]"),Y("Good morning, this is [Name] with [Company]. I couldn't find your vendor process on your website, could you point me in the right direction?")],a:{en:"Years in business · service list · filling the silence.",es:"Años en el mercado · lista de servicios · llenar el silencio."},x:{en:"Let them explain the process.",es:"Deja que expliquen el proceso."}},
{n:{en:"Gatekeeper",es:"Recepción"},t:{en:"Never sell to the filter",es:"Nunca vendas al filtro"},s:{en:"The receptionist's job is to protect the calendar of the people who decide. Don't try to convince her; she can't say yes. Be courteous, ask who handles cleaning vendors, get a name and a good time to reach them. If she says they are not interested, thank her and still ask for the name. That answer was hers, not the decision maker's.",es:"El trabajo de la recepcionista es proteger la agenda de quienes deciden. No intentes convencerla; ella no puede decir que sí. Sé cortés, pregunta quién maneja los proveedores de limpieza, consigue un nombre y una buena hora para ubicarlo. Si dice que no están interesados, agradece y aun así pide el nombre. Esa respuesta fue de ella, no del decisor."},ex:[Y("Who normally handles your commercial cleaning vendors?"),T("We're not interested."),Y("I completely understand, thank you. Just so I don't bother the wrong person next time, who handles cleaning vendors on your team? Is there a good time to reach them?"),T("Why are you calling?"),Y("We were reviewing your website and couldn't find your vendor process, so I was hoping someone could point me in the right direction.")],a:{en:"Insisting · pitching · saying “we're calling to sell”.",es:"Insistir · pitch · decir “llamamos para vender”."},x:{en:"Record the decision maker; retry at that time.",es:"Registra al decisor; reintenta a esa hora."}},
{n:{en:"Vendor process",es:"Proceso de vendors"},t:{en:"Go one step deeper each time",es:"Un paso más profundo cada vez"},s:{en:"Who handles it → portal? → documents? → what happens after submission → who reviews → when → when to follow up → can we meet. Prequalified is not approved: ask for the next step, not how to apply.",es:"Quién lo maneja → ¿portal? → ¿documentos? → qué pasa después de enviar → quién revisa → cuándo → cuándo dar seguimiento → podemos reunirnos. Precalificado no es aprobado: pregunta el siguiente paso, no cómo aplicar."},ex:[Y("Is that handled through your website, or is there someone I should email directly?"),Y("What information would you like us to include?"),Y("Once we send everything, what does the process look like from there, is there a review period or someone we should follow up with?"),Y("Are there specific documents you normally require?"),Y("And when would be a good time for me to follow up after we submit everything?"),Y("I noticed we're already approved through [portal], how does your team evaluate new vendors once they're in the system?")],a:{en:"Asking how to apply when you're already in their system.",es:"Preguntar cómo aplicar cuando ya estás en su sistema."},x:{en:"Submit the package the same day; follow up on their date.",es:"Envía el paquete el mismo día; da seguimiento en su fecha."}},
{n:{en:"They have a provider",es:"Ya tienen proveedor"},t:{en:"It's a timing question, not a rejection",es:"Es una pregunta de timing, no un rechazo"},s:{en:"Of course they have a company, almost everyone you call does. Don't argue with it and don't say a word against the current provider. Treat it as a timing question: when does the agreement come up for renewal, and would it be all right to reach out a couple of months before that. Then put that date in the CRM, because it is the only real trigger you have.",es:"Claro que ya tienen empresa, casi todos a los que llamas la tienen. No discutas y no digas ni una palabra contra el proveedor actual. Trátalo como una pregunta de timing: cuándo se renueva el contrato y si estaría bien contactarlos un par de meses antes. Luego pon esa fecha en el CRM, porque es el único trigger real que tienes."},ex:[T("We already have a cleaning company."),Y("That makes sense, most of the companies we work with had a provider before us too. Out of curiosity, when does your current agreement come up for renewal?"),Y("Would it be alright if I reached back out a month or two before that?"),Y("How has the current service been working for you?")],a:{en:"Arguing · bad-mouthing the competitor.",es:"Discutir · hablar mal del competidor."},x:{en:"Renewal date in the CRM with a reminder.",es:"Fecha de renovación en el CRM con recordatorio."}},
{n:{en:"“Just send me an email”",es:"“Solo mándame un email”"},t:{en:"Qualify before you hang up",es:"Califica antes de colgar"},s:{en:"“Send me an email” is usually a polite way to end the call, and if you just say “sure” you will send something generic that nobody reads. Instead, agree happily and use it to qualify: what would they like to see, what is the best address, and which day works to follow up once they've looked at it. Now the email has a purpose and a date attached.",es:"“Mándeme un email” casi siempre es una forma educada de terminar la llamada, y si solo dices “claro” vas a mandar algo genérico que nadie lee. En lugar de eso, acepta con gusto y úsalo para calificar: qué les gustaría ver, cuál es la mejor dirección y qué día les queda bien para dar seguimiento cuando lo hayan revisado. Ahora el email tiene un propósito y una fecha."},ex:[T("Just send me an email."),Y("Absolutely, I'd be happy to. Just so I send the most relevant information, what would you like us to include?"),Y("Perfect. And what would be the best email address for that?"),Y("Once you've had a chance to review it, would Thursday or Friday be better for me to follow up?"),Y("Perfect, I'll send everything today and follow up with you Friday.")],a:{en:"Hanging up with “I'll send you an email”.",es:"Colgar con “le mando un email”."},x:{en:"Send today + follow-up scheduled.",es:"Enviar hoy + seguimiento agendado."}},
{n:{en:"Voicemail",es:"Buzón de voz"},t:{en:"20 seconds, one reason, an email to follow",es:"20 segundos, una razón, un email después"},s:{en:"Name, company, legitimate reason, and that you'll email. Don't ask for a callback as the only option.",es:"Nombre, empresa, razón legítima y que enviarás un email. No pidas que te devuelvan la llamada como única opción."},ex:[Y("Hi [Name], this is [Name] with [Company]. I couldn't find your vendor process for commercial cleaning on your website and wanted to ask who handles that on your team. I'll send a short email as well, my number is [phone]. Thank you!")],a:{en:"Long messages · services in the voicemail.",es:"Mensajes largos · servicios en el buzón."},x:{en:"Email the same day; second call in 2–3 days.",es:"Email el mismo día; segunda llamada en 2–3 días."}},
{n:{en:"Close the call",es:"Cerrar la llamada"},t:{en:"Walkthrough, or a date",es:"Walkthrough, o una fecha"},s:{en:"Interest sounds like questions (insured? references? multiple locations?). Answer, ask one back, and move to seeing the property. A “no for now” is a future date you haven't booked yet.",es:"El interés suena a preguntas (¿asegurados? ¿referencias? ¿varias ubicaciones?). Responde, devuelve una pregunta y avanza a conocer la propiedad. Un “no por ahora” es una fecha futura que aún no has agendado."},ex:[T("Are you insured?"),Y("Yes, General Liability and Workers' Comp. Are those documents typically requested during your vendor approval process?"),Y("Based on everything we've discussed, the best next step is a quick walkthrough so we can recommend the right scope instead of guessing. Is Tuesday or Thursday better for you?"),T("We're not interested right now."),Y("I completely understand, thank you for your time. Out of curiosity, when does your current agreement typically come up for renewal?")],a:{en:"Quoting without a walkthrough · hanging up without a future date.",es:"Cotizar sin walkthrough · colgar sin fecha futura."},x:{en:"Before hanging up: decision maker, process, documents, next step, date.",es:"Antes de colgar: decisor, proceso, documentos, siguiente paso, fecha."}},
{seg:"com",n:{en:"Commercial close",es:"Cierre comercial"},t:{en:"Walkthrough now, proposal with a review date",es:"Walkthrough ahora, propuesta con fecha de revisión"},s:{en:"Commercial closes in steps: walkthrough → proposal → review call → agreement. Each step is closed with two options and a date. If the scope is simple and pricing is approved, close on the call.",es:"Lo comercial se cierra por pasos: walkthrough → propuesta → llamada de revisión → acuerdo. Cada paso se cierra con dos opciones y una fecha. Si el alcance es simple y el precio está aprobado, cierra en la llamada."},ex:[Y("The best next step is a quick walkthrough so we recommend the right scope instead of guessing. Is Tuesday or Thursday better?"),Y("I'll have the proposal to you by Thursday. Would Friday at 10 or Monday at 2 work to go over it together?"),Y("If the proposal reflects everything we discussed, is there anything that would keep you from moving forward?"),Y("Great, I'll send the service agreement today. Would you prefer to start on the 1st or the following Monday?")],a:{en:"Sending a proposal without a review call · closing before they named the value.",es:"Enviar propuesta sin llamada de revisión · cerrar antes de que nombren el valor."},x:{en:"Agreement → onboarding → referral ask.",es:"Acuerdo → onboarding → pedir referido."}},
{n:{en:"Vendor portals",es:"Vendor portals"},t:{en:"Do the homework the portal lets you do alone",es:"Haz la tarea que el portal te deja hacer solo"},s:{en:"Look on their site for Vendor Registration, Become a Vendor, Procurement, Vendor Compliance or Bids & RFPs. If a portal exists, complete everything it allows before you call, account, COI, W-9, license, references, so the call is about the next step, not about how to apply. If you are already in a system like NetVendor, Compliance Depot, RealPage or Avetta, remember that prequalified is not approved: ask how they evaluate vendors once they are in. If there is no portal and no information, then the call exists to discover the process.",es:"Busca en su sitio Vendor Registration, Become a Vendor, Procurement, Vendor Compliance o Bids & RFPs. Si existe portal, completa todo lo que permita antes de llamar, cuenta, COI, W-9, licencia, referencias, para que la llamada sea sobre el siguiente paso, no sobre cómo aplicar. Si ya estás en un sistema como NetVendor, Compliance Depot, RealPage o Avetta, recuerda que precalificado no es aprobado: pregunta cómo evalúan a los vendors una vez dentro. Si no hay portal ni información, entonces la llamada existe para descubrir el proceso."},ex:[Y("Good morning, this is [Name] with [Company]. We recently completed our registration in your vendor system and I wanted to check what the next steps look like on your end."),Y("I noticed we're already approved through [portal], how does your team typically evaluate new cleaning vendors once they're in the system?"),Y("Is there a review cycle, or does it come up when a contract renews or a new property opens?")],a:{en:"Asking how to apply when you are already registered · calling before finishing the portal.",es:"Preguntar cómo aplicar cuando ya estás registrado · llamar antes de terminar el portal."},x:{en:"Next step + review date in the CRM.",es:"Siguiente paso + fecha de revisión en el CRM."}},
{n:{en:"Position the value",es:"Posicionar el valor"},t:{en:"Say it in their language, not yours",es:"Dilo en su lenguaje, no en el tuyo"},s:{en:"Once you understand how they operate, adjust what you say to their world. A property manager cares about the same standard across several buildings and one person to call. A general contractor cares about schedules that move and deadlines that don't. An office or a medical practice cares about protocols, consistency and detail. Say the thing they care about back to them, briefly, and let them confirm it. You are not selling cleaning; you are selling that this stops being something they worry about.",es:"Una vez que entiendes cómo operan, ajusta lo que dices a su mundo. A un property manager le importa el mismo estándar en varios edificios y una sola persona a quien llamar. A un contratista general le importan cronogramas que se mueven y fechas que no. A una oficina o consultorio le importan protocolos, consistencia y detalle. Dile de vuelta, en corto, lo que le importa y deja que lo confirme. No vendes limpieza; vendes que esto deje de ser algo de lo que tengan que preocuparse."},ex:[Y("Based on what you've shared, it sounds like consistency across your properties matters a lot for your team. That's actually where we spend most of our time."),Y("Sounds like timing is critical on your projects, we're used to working around changing schedules and tight deadlines. What does a typical turnover window look like for you?"),Y("For a medical office the detail in exam rooms and restrooms is where it shows. Is that where the current provider has been falling short?")],a:{en:"The same generic pitch for everyone.",es:"El mismo discurso genérico para todos."},x:{en:"Listen for buying signals.",es:"Escucha las señales de compra."}},
{n:{en:"Risk signals",es:"Señales de riesgo"},t:{en:"Notice it early, recover the call",es:"Detéctalo a tiempo, recupera la llamada"},s:{en:"Not every call moves forward, and that is fine, what matters is noticing early and not wasting ten minutes. Very short answers: ask one direct question, then offer to call back at a better time. They never give a name: ask, politely, who handles cleaning vendors. “Just send me an email” with no context: get the context before you hang up. You are only ever talking to reception: ask directly for the person who manages vendors.",es:"No toda llamada avanza, y está bien, lo que importa es notarlo temprano y no gastar diez minutos. Respuestas muy cortas: haz una pregunta directa y ofrece llamar en mejor momento. Nunca dan un nombre: pregunta, con cortesía, quién maneja los vendors de limpieza. “Solo mándeme un email” sin contexto: consigue el contexto antes de colgar. Solo hablas con recepción: pide directamente a la persona que maneja proveedores."},ex:[Y("It sounds like I caught you at a busy time, would it be better if I reached back out later this week? And just so I follow up with the right person, who handles cleaning vendors on your team?"),Y("I don't want to take more of your time. Is there someone on the team I should be talking to about this?")],a:{en:"Hanging up at the first short answer without trying one more question.",es:"Colgar a la primera respuesta corta sin intentar una pregunta más."},x:{en:"Retry time or decision maker in the CRM.",es:"Hora de reintento o decisor en el CRM."}},
{n:{en:"Five calls that went wrong",es:"Cinco llamadas que salieron mal"},t:{en:"And what should have happened",es:"Y qué debió pasar"},s:{en:"Presented for five minutes before asking anything, the prospect hung up; should have opened with the vendor-process question and listened. Quoted in the second minute without knowing the scope; should have moved to a walkthrough. Argued with the receptionist who said “not interested”; should have thanked her and asked for the name. Hung up after “send me an email” without asking anything; should have asked what they wanted to see. Booked a walkthrough and never wrote it in the CRM, two weeks later nobody followed up; should have recorded it before the next call.",es:"Presentó cinco minutos antes de preguntar algo, el prospecto colgó; debió abrir con la pregunta del proceso de vendors y escuchar. Cotizó en el segundo minuto sin conocer el alcance; debió pasar a un walkthrough. Discutió con la recepcionista que dijo “no nos interesa”; debió agradecer y pedir el nombre. Colgó después de “mándeme un email” sin preguntar nada; debió preguntar qué querían ver. Agendó un walkthrough y nunca lo escribió en el CRM, dos semanas después nadie dio seguimiento; debió registrarlo antes de la siguiente llamada."},ex:[Y("I'd love to give you an accurate number, can we set up a quick walkthrough first?"),Y("Thank you, and just so I don't bother the wrong person next time, who handles cleaning vendors on your team?"),Y("Absolutely. Just so I send the most relevant information, what would you like to see?")],a:{en:"Repeating the same five mistakes.",es:"Repetir los mismos cinco errores."},x:{en:"Before hanging up: decision maker, process, documents, next step, date.",es:"Antes de colgar: decisor, proceso, documentos, siguiente paso, fecha."}}],
email:[
{n:{en:"Rules",es:"Reglas"},t:{en:"Short, one ask, same day",es:"Corto, una sola petición, el mismo día"},s:{en:"A sales email has one job: earn the next step. Keep it to three short paragraphs, one clear question at the end, and no attachments they didn't ask for. And send it the day you said you would, for the client that is the first proof of whether you keep your word.",es:"Un email de ventas tiene un solo trabajo: ganar el siguiente paso. Tres párrafos cortos, una sola pregunta clara al final y nada de adjuntos que no pidieron. Y mándalo el día que dijiste, para el cliente es la primera prueba de si cumples tu palabra."},ex:[Y("Subject lines that work:\nExploring a partnership with [Company]\nVendor package, [Your Company] for [Property]\nProposal for [Property], quick question\nStill need help with [service]?\nThank you, [Property] walkthrough")],a:{en:"Service lists · “Dear Sir/Madam” · three questions in one email · sending and waiting.",es:"Listas de servicios · “Estimado/a” · tres preguntas en un email · enviar y esperar."},x:{en:"Every email ends with a day.",es:"Cada email termina con un día."}},
{n:{en:"Cold outreach",es:"Primer contacto"},t:{en:"Introduce, ask about their process",es:"Preséntate, pregunta por su proceso"},s:{en:"If they have a formal vendor process on their site, complete it instead of writing. If not, one short email asking how they bring on vendors, then a call in 2–3 days.",es:"Si tienen un proceso formal de vendors en su sitio, complétalo en vez de escribir. Si no, un email corto preguntando cómo incorporan vendors, y una llamada en 2–3 días."},ex:[Y("Subject: Exploring a partnership with [Company]\n\nHi [Name], my name is [Name] with [Your Company], a commercial cleaning company serving [Area]. We work with property managers, contractors and facility teams on everything from routine cleaning to post-construction turnovers. I'd love to learn how [Company] brings on cleaning vendors and whether there's an opportunity to build a partnership. Would you be open to a short call this week?")],a:{en:"Attaching a brochure nobody asked for.",es:"Adjuntar un brochure que nadie pidió."},x:{en:"Call in 2–3 days; text after that.",es:"Llamada en 2–3 días; texto después."}},
{n:{en:"Vendor package",es:"Vendor package"},t:{en:"Prepared + sent + recorded",es:"Preparado + enviado + registrado"},s:{en:"COI, W-9, license, references, capability statement, only what they asked for. Confirm receipt and ask when they review. A draft doesn't count; a recorded submission does.",es:"COI, W-9, licencia, referencias, capability statement, solo lo que pidieron. Confirma recepción y pregunta cuándo revisan. Un borrador no cuenta; un envío registrado sí."},ex:[Y("Subject: Vendor package, [Your Company] for [Property]\n\nHi [Name], as requested, attached is our vendor package: COI, W-9, license, references and capability statement. If anything else is needed for approval, I'm happy to provide it. When does your team typically review new vendors?")],a:{en:"Sending half the documents · not recording the review date.",es:"Enviar la mitad de los documentos · no registrar la fecha de revisión."},x:{en:"Follow up on the review date they gave you.",es:"Seguimiento en la fecha de revisión que te dieron."}},
{n:{en:"After the walkthrough",es:"Después del walkthrough"},t:{en:"Their priorities, in their words, the same day",es:"Sus prioridades, en sus palabras, el mismo día"},s:{en:"Three bullets of what they told you, the proposal date, the review call. It proves you listened and locks the two dates in writing.",es:"Tres puntos de lo que te dijeron, la fecha de la propuesta, la llamada de revisión. Demuestra que escuchaste y deja las dos fechas por escrito."},ex:[Y("Subject: Thank you, [Property] walkthrough\n\nHi [Name], thank you for the time today. Here's what I noted: [priority 1], [priority 2], [priority 3]. The proposal will be with you by [day], and we're set to review it together on [day] at [time]. If I missed anything, just reply here.")],a:{en:"Waiting until the proposal is ready to write.",es:"Esperar a que la propuesta esté lista para escribir."},x:{en:"Proposal within 24–48 h.",es:"Propuesta en 24–48 h."}},
{n:{en:"Proposal follow-up",es:"Seguimiento de propuesta"},t:{en:"Day 1 · 3 · 7 · 14 · 30",es:"Día 1 · 3 · 7 · 14 · 30"},s:{en:"Never send a proposal and wait. Review call on day 1, a check-in on day 3, a call on day 7, added value on day 14, decision or future date on day 30.",es:"Nunca envíes una propuesta y esperes. Llamada de revisión el día 1, check-in el día 3, llamada el día 7, valor agregado el día 14, decisión o fecha futura el día 30."},ex:[Y("Subject: Proposal for [Property], quick question\n\nHi [Name], I wanted to check whether you had a chance to review the proposal for [Property]. If anything needs adjusting, scope, frequency or start date, I'm happy to tailor it. Would Thursday or Friday work for a quick call?"),Y("Hi [Name], one thing that may help as you compare: we recently took over a property similar to yours where missed nights were the issue, happy to share how the first 60 days went. Still on for Friday?")],a:{en:"“Just checking in” with nothing to add.",es:"“Solo para dar seguimiento” sin nada que aportar."},x:{en:"Decision, or a renewal date + monthly nurture.",es:"Decisión, o fecha de renovación + nurture mensual."}},
{n:{en:"Reactivation",es:"Reactivación"},t:{en:"Reference what they asked for, ask one thing",es:"Referencia lo que pidieron, pregunta una sola cosa"},s:{en:"Old inquiries, past customers, lost proposals: remind them of the original need, no guilt, one easy question.",es:"Consultas viejas, clientes pasados, propuestas perdidas: recuérdales la necesidad original, sin reproche, una pregunta fácil."},ex:[Y("Subject: Still need help with [service]?\n\nHi [Name], you reached out a while back about [service] for [Property]. If that's still on your list, I'd be glad to pick up where we left off, no pressure either way. Is this week or next better for a quick conversation?"),Y("Hi [Name], we took care of [service] for you last [season]. Wanted to check in and see if you'd like to get something on the calendar before [busy period].")],a:{en:"“Why didn't you get back to me?”",es:"“¿Por qué no me respondió?”"},x:{en:"Reply → qualify again; silence → nurture monthly.",es:"Respuesta → calificar de nuevo; silencio → nurture mensual."}},
{seg:"com",n:{en:"Closing by email",es:"Cierre por email"},t:{en:"The agreement email",es:"El email del acuerdo"},s:{en:"When they said yes: send the agreement the same day, name the start date, name the next contact. Make signing the only thing left to do.",es:"Cuando dijeron que sí: envía el acuerdo el mismo día, nombra la fecha de inicio, nombra el siguiente contacto. Que firmar sea lo único que falta."},ex:[Y("Subject: Service agreement, [Property]\n\nHi [Name], great speaking with you today. Attached is the service agreement reflecting what we agreed: [scope], [frequency], starting [date]. Once it's signed, [Ops contact] will reach out to confirm access and the first-night details. If anything needs adjusting, just reply here, happy to update it today.")],a:{en:"Waiting a week to send the agreement.",es:"Esperar una semana para enviar el acuerdo."},x:{en:"Signed → handoff to operations.",es:"Firmado → handoff a operaciones."}}],
sms:[
{n:{en:"SMS rules",es:"Reglas de SMS"},t:{en:"Short, human, easy to answer",es:"Corto, humano, fácil de responder"},s:{en:"A text message is a real sales conversation, not a reminder tool, deals move and close over text every day. The rules are simple: one idea per message, a question they can answer in one line, business hours only, and never two texts in a row without a reply. Write the way you would to a colleague, not the way a marketing blast reads.",es:"Un mensaje de texto es una conversación de venta real, no una herramienta de recordatorios, hay ventas que avanzan y se cierran por texto todos los días. Las reglas son simples: una idea por mensaje, una pregunta que se responda en una línea, solo en horario laboral y nunca dos textos seguidos sin respuesta. Escribe como le escribirías a un colega, no como suena un mensaje masivo."},ex:[Y("Hi [Name], this is [Name] with [Company], we handle commercial cleaning in [Area]. Who's the right person on your team for vendor questions? Happy to keep it short."),Y("Hi [Name], [Name] with [Company]. Quick one: is [Company] reviewing cleaning vendors right now, or is everything set for now?")],a:{en:"Service lists · texts at 9pm · three texts in a row.",es:"Listas de servicios · textos a las 9pm · tres textos seguidos."},x:{en:"Reply → qualify; no reply → follow-up in 2–3 days.",es:"Respuesta → calificar; sin respuesta → seguimiento en 2–3 días."}},
{n:{en:"After no answer / after a call",es:"Sin respuesta / después de una llamada"},t:{en:"Context and an easy way out",es:"Contexto y una salida fácil"},s:{en:"After a missed call: say why you called and offer text as the channel. After a good call: confirm what you agreed with the date.",es:"Después de una llamada sin respuesta: di por qué llamaste y ofrece el texto como canal. Después de una buena llamada: confirma lo acordado con fecha."},ex:[Y("Hi [Name], [Name] with [Company], I tried calling about your cleaning vendor process. No rush; feel free to reply here whenever it's convenient."),Y("Thanks for your time today, [Name]. As discussed, I'll send the proposal by [time] and we'll connect [day]. Text me here anytime."),Y("Walkthrough confirmed: [day] at [time], [address]. See you then!")],a:{en:"The same text twice.",es:"El mismo texto dos veces."},x:{en:"Two touches max without reply, then email or nurture.",es:"Máximo dos toques sin respuesta, luego email o nurture."}},
{n:{en:"Inbound text · qualify",es:"Texto inbound · calificar"},t:{en:"Fast reply, one question at a time",es:"Respuesta rápida, una pregunta a la vez"},s:{en:"A text from a web form or Google is a hot lead. Answer within minutes, thank them, ask what and where, never a price in the first message.",es:"Un texto desde un formulario web o Google es un lead caliente. Responde en minutos, agradece, pregunta qué y dónde, nunca precio en el primer mensaje."},ex:[Y("Hi [Name], thanks for reaching out to [Company]! Happy to help. Could you tell me a bit about the property and what you're looking for?"),Y("Got it. Two quick questions so I can help properly: roughly how big is the space, and when would you want service to start?"),Y("Are you the person who'd make the call on this, or is someone else involved too?")],a:{en:"Quoting in the first text · five questions in one message.",es:"Cotizar en el primer texto · cinco preguntas en un mensaje."},x:{en:"Qualified → call or walkthrough.",es:"Calificado → llamada o walkthrough."}},
{n:{en:"Price by text",es:"Precio por texto"},t:{en:"Contextualize, don't dodge",es:"Contextualiza, no esquives"},s:{en:"Ask what structure or range they're working with and get the minimum scope. Give a preliminary range only from approved pricing, then move to the walkthrough for the exact number.",es:"Pregunta con qué estructura o rango trabajan y consigue el alcance mínimo. Da un rango preliminar solo desde precio aprobado, luego pasa al walkthrough para el número exacto."},ex:[Y("Happy to talk pricing. It depends on size, frequency and scope, do you already have a budget or a rate you're working with?"),Y("So I give you a number that fits: recurring or one-time, and about how many square feet?"),Y("Thanks, a preliminary range would be [approved range]. Actual pricing depends on scope and condition, so a quick walkthrough gets you an exact number. Would [day] or [day] work?")],a:{en:"A number without approved pricing · treating a ballpark as final.",es:"Un número sin precio aprobado · tratar un ballpark como final."},x:{en:"Walkthrough scheduled by text.",es:"Walkthrough agendado por texto."}},
{n:{en:"Schedule · follow up · close",es:"Agendar · seguimiento · cerrar"},t:{en:"Two options, in writing",es:"Dos opciones, por escrito"},s:{en:"Offer two times, confirm address and who attends. Follow up proposals without pressure. Close with alternatives and confirm the details in writing.",es:"Ofrece dos horarios, confirma dirección y quién asiste. Da seguimiento a propuestas sin presión. Cierra con alternativas y confirma los detalles por escrito."},ex:[Y("Let's get you an exact proposal. I can stop by for a quick walkthrough, would Tuesday morning or Thursday afternoon work better?"),Y("Hi [Name], wanted to make sure the proposal for [Property] came through. Anything you'd like adjusted, scope, frequency, start date?"),Y("Great, to get started, would you prefer a morning or evening schedule, and a start date of [day] or [day]?"),Y("Perfect, [Name]. I'll send the agreement to [email] today. Once it's signed, our team confirms the start details. Thank you for trusting [Company]!")],a:{en:"“Let me know when works” · daily texts.",es:"“Avíseme cuándo le queda bien” · textos diarios."},x:{en:"Agreement sent → onboarding.",es:"Acuerdo enviado → onboarding."}},
{n:{en:"Objection by text",es:"Objeción por texto"},t:{en:"Acknowledge, one question, door open",es:"Reconoce, una pregunta, puerta abierta"},s:{en:"Same Feel-Felt-Found logic, in two lines.",es:"La misma lógica Feel-Felt-Found, en dos líneas."},ex:[T("We already have someone."),Y("Totally understand, most of our clients had a provider before us. When does your current agreement come up for renewal? Happy to check back then."),T("Too expensive."),Y("Fair point. Can I ask what you're comparing it to? Scope and frequency can change the number quite a bit."),T("Not now."),Y("No problem at all. What would need to happen on your side for this to become a priority? I'll check back around then.")],a:{en:"Arguing by text · discount by text.",es:"Discutir por texto · descuento por texto."},x:{en:"Renewal date or answer → next step.",es:"Fecha de renovación o respuesta → siguiente paso."}},
{n:{en:"LinkedIn",es:"LinkedIn"},t:{en:"Connect, warm up, one message, two follow-ups",es:"Conecta, calienta, un mensaje, dos seguimientos"},s:{en:"Personalized request (no pitch), interact with their content, then one message with the partnership or vendor angle. Follow up at ~2 weeks and ~2–3 months. After that, move to the cold multichannel flow.",es:"Solicitud personalizada (sin pitch), interactúa con su contenido, luego un mensaje con el ángulo de alianza o de vendor. Seguimiento a ~2 semanas y ~2–3 meses. Después, pasa al flujo multicanal frío."},ex:[Y("Hi [Name], I work with property and facility teams here in [City] on commercial cleaning. I'd love to connect and follow what [Company] is doing in the area."),Y("Hi [Name], thanks for connecting! I run [Company], a commercial cleaning company in [City]. I'd love to explore a potential partnership, referrals, a joint project, or simply staying in touch as a resource. Would you be open to a quick call sometime?"),Y("Hi [Name], great to connect! I'd like to explore becoming a strategic partner for [Company] on the cleaning side. Could you point me to the right process (or person) for becoming an approved vendor?"),Y("Hi [Name], just following up, I don't want to be a bother! Still very interested in building a relationship with [Company]. If there's someone else on your team I should speak with, I'd appreciate the pointer.")],a:{en:"Pitch in the connection request · weekly follow-ups.",es:"Pitch en la solicitud · seguimientos semanales."},x:{en:"Positive reply → call / walkthrough.",es:"Respuesta positiva → llamada / walkthrough."}},
{n:{en:"Google · web form · other platforms",es:"Google · formulario web · otras plataformas"},t:{en:"Speed wins",es:"La velocidad gana"},s:{en:"Messages from Google Business, Yelp, Facebook or a web form: reply within minutes, move to phone or text, and qualify like an inbound call. The first company to answer usually gets the walkthrough.",es:"Mensajes de Google Business, Yelp, Facebook o un formulario web: responde en minutos, pasa a teléfono o texto y califica como una llamada inbound. La primera empresa que responde suele conseguir el walkthrough."},ex:[Y("Thanks for the message! Happy to help with [service]. What's the best number to reach you, or would you prefer to keep going here?"),Y("Great, is this for recurring cleaning, a one-time job, or post-construction? And roughly how large is the space?"),Y("We can take a look this week: would [day] or [day] work for a quick walkthrough?")],a:{en:"Answering the next day · sending a price list.",es:"Responder al día siguiente · enviar lista de precios."},x:{en:"Phone or walkthrough within 24 h.",es:"Teléfono o walkthrough en 24 h."}}]};

const R={
ib:[
{n:{en:"Answer",es:"Contestar"},t:{en:"You're the expert they were hoping to reach",es:"Eres el experto que esperaban encontrar"},s:{en:"A homeowner calls when something is bothering them today: a move, guests, a mess, no time. They want someone who sounds like they do this every day and can solve it now. Warm, confident, specific, and never “I'll get back to you with a quote”.",es:"Un cliente residencial llama cuando algo le molesta hoy: una mudanza, visitas, desorden, falta de tiempo. Quiere a alguien que suene a que hace esto todos los días y lo resuelva ahora. Cálido, seguro, específico, y nunca “le devuelvo la llamada con una cotización”."},ex:[Y("Thanks for calling [Company], this is [Name], how can I help you today?"),T("I need someone to clean my house."),Y("You're in the right place, that's exactly what we do. Let me ask you a few quick questions so I can give you the right option and a price today. What kind of cleaning are you thinking: a one-time deep clean, a move-in / move-out, or regular service?"),Y("Perfect. Tell me what's going on at the house right now.")],a:{en:"“Let me check and call you back” · asking for their budget first · long menus of services.",es:"“Déjeme revisar y le llamo” · preguntar su presupuesto primero · menús largos de servicios."},x:{en:"Discover in 60 seconds.",es:"Descubre en 60 segundos."}},
{n:{en:"Discover",es:"Descubrir"},t:{en:"One open question, then fill the gaps",es:"Una pregunta abierta, luego llena los huecos"},s:{en:"Start open: invite them to tell you about the home and what's going on. In that story they'll usually give you the service, the size, the condition and the reason, without feeling interviewed. Probe what they said, reflect it back, and only then ask closed questions for whatever is still missing to price and book.",es:"Empieza abierto: invítalos a contarte de la casa y qué está pasando. En esa historia normalmente te dan el servicio, el tamaño, la condición y el motivo, sin sentirse interrogados. Profundiza en lo que dijeron, refléjalo, y solo entonces haz preguntas cerradas para lo que aún falta para cotizar y reservar."},ex:[Y("Tell me a little about the house and what's going on, what made you reach out today?"),T("We're moving out on the 20th and the landlord wants it spotless. It's a 3-bedroom, the kitchen's rough, and we have two dogs."),Y("Got it, so a move-out on the 20th, the kitchen needs real attention, and there's pet hair to deal with. What does the landlord usually check on the walkthrough?"),Y("How long has it been since it had a deep clean?"),Y("Just to make sure I have it: 3 bedrooms, move-out before the 20th, kitchen and pet hair are the priorities. Right?"),Y("Two quick things so I can price it right: how many bathrooms, and is the fridge and oven staying?"),Y("And will you be there, or should we plan on a code or a lockbox?")],a:{en:"Opening with “how many bedrooms?” · a checklist of closed questions · quoting before the story.",es:"Abrir con “¿cuántas recámaras?” · una lista de preguntas cerradas · cotizar antes de la historia."},x:{en:"Recommend the right service.",es:"Recomienda el servicio correcto."}},
{n:{en:"Recommend",es:"Recomendar"},t:{en:"Tell them what they need, like a pro",es:"Diles lo que necesitan, como un profesional"},s:{en:"Homeowners trust the person who recommends, not the one who asks “what would you like?”. Based on what they told you, name the service, explain what's included in plain words, and set expectations: insured, trained team, supplies included, satisfaction guaranteed (only what your company actually offers).",es:"El cliente confía en quien recomienda, no en quien pregunta “¿qué le gustaría?”. Con lo que te dijeron, nombra el servicio, explica qué incluye en palabras simples y fija expectativas: asegurados, equipo entrenado, suministros incluidos, garantía de satisfacción (solo lo que tu empresa realmente ofrece)."},ex:[Y("Based on what you described, I'd recommend starting with a deep clean, that gets the house to a true baseline: baseboards, inside the microwave, behind and under what we can move, all the bathrooms detailed. After that, a biweekly service keeps it there for a lot less."),Y("For a move-out, we do the full empty-home clean: inside all cabinets and drawers, inside the oven and fridge, all bathrooms, floors, and we make sure it's ready for the walkthrough with your landlord."),Y("Our team is insured and background-checked, we bring all supplies and equipment, and if anything isn't right you call me and we come back, that's our guarantee."),Y("With two dogs, I'd add the pet-hair treatment on the upholstery and floors, that's where most people notice the difference.")],a:{en:"“What package would you like?” · reading a service list · promising something your company doesn't offer.",es:"“¿Qué paquete le gustaría?” · leer la lista de servicios · prometer algo que tu empresa no ofrece."},x:{en:"Price with confidence.",es:"Cotiza con seguridad."}},
{n:{en:"Price",es:"Precio"},t:{en:"A clear number, said once, without apology",es:"Un número claro, dicho una vez, sin disculpas"},s:{en:"Residential pricing comes from your approved rate card, say it with confidence, tie it to what's included, and offer options (deep vs. standard, weekly / biweekly / monthly). Then stop talking. The pause is where they say yes.",es:"El precio residencial sale de tu tarifa aprobada, dilo con seguridad, átalo a lo que incluye y ofrece opciones (deep vs. estándar, semanal / quincenal / mensual). Luego deja de hablar. La pausa es donde dicen que sí."},ex:[Y("For a 3-bed, 2-bath deep clean the price is [approved rate]. That includes everything I mentioned, all supplies, and a team of two for about four hours."),Y("If you'd like to keep it up, biweekly service after that is [approved rate] per visit, most families find that's the sweet spot."),Y("Two ways to go: a one-time deep clean at [rate], or the deep clean plus biweekly, which brings the first visit down to [rate]. Which sounds better for you?"),Y("For the move-out at [rate], that's the full empty-home clean, and if the landlord's walkthrough flags anything we'll come back, no charge.")],a:{en:"“It's usually around…” · discounting before they ask · apologizing for the price · quoting without approved rates.",es:"“Normalmente anda por…” · descontar antes de que pidan · disculparse por el precio · cotizar sin tarifas aprobadas."},x:{en:"Silence, then close.",es:"Silencio, luego cierra."}},
{n:{en:"Objections",es:"Objeciones"},t:{en:"Short answers, back to the booking",es:"Respuestas cortas, de vuelta a la reserva"},s:{en:"Residential objections are quick and emotional. Acknowledge in one sentence, give one reason, and return to the calendar. Never lower the price to win, offer a smaller scope instead.",es:"Las objeciones residenciales son rápidas y emocionales. Reconoce en una frase, da una razón y vuelve al calendario. Nunca bajes el precio para ganar, ofrece un alcance menor."},ex:[T("That's more than I expected."),Y("I understand, a deep clean is more than a regular clean because we're getting to everything that's been building up. If it helps, we can do a standard clean at [rate] and add the deep-clean items you care about most, like the bathrooms and the kitchen. Which would you prefer?"),T("Another company quoted me less."),Y("That happens, and it's usually a different scope: fewer people, fewer hours, or supplies not included. What I can promise is what's on the list, an insured team, and that we come back if anything's missed. Would Thursday or Saturday work?"),T("I need to talk to my husband / wife."),Y("Of course. I'll text you the quote with everything included so you can show them. Can I hold Thursday morning for you until tomorrow? I'll check in then either way."),T("I'll call you back."),Y("Sure. Just so you know, this week's spots go quickly, would it help if I pencil you in for Saturday and you confirm by text? No charge to hold it."),T("Can you just give me a price per hour?"),Y("We price by the job so you know the total upfront, no surprises if it takes longer. For your home that's [rate], everything included.")],a:{en:"Arguing · dropping the price · “okay, call me back”.",es:"Discutir · bajar el precio · “ok, llámeme”."},x:{en:"Close on the same call.",es:"Cierra en la misma llamada."}},
{n:{en:"Close",es:"Cerrar"},t:{en:"Book it on this call",es:"Resérvalo en esta llamada"},s:{en:"Residential closes on the first call. Ask when they'd like to start, offer two specific slots, take the details, and confirm. The written quote goes out after, as documentation of what they already booked, not as something to “think about”.",es:"Lo residencial se cierra en la primera llamada. Pregunta cuándo quieren empezar, ofrece dos horarios específicos, toma los datos y confirma. La cotización escrita sale después, como documentación de lo que ya reservaron, no como algo para “pensar”."},ex:[Y("When would you like us to come, this week or next?"),Y("I have Thursday at 9 or Saturday at 1. Which works better for you?"),Y("Great, Thursday at 9. What's the address? And will someone be home, or should we use a code?"),Y("Anything I should tell the team, parking, alarm, the dogs?"),Y("You're all set: Thursday at 9, deep clean, [rate], everything we talked about. I'll text you a confirmation with the details so you have it in writing, and the team will text when they're on the way."),Y("Since you're starting with the deep clean, want me to go ahead and put you on the biweekly schedule after that? You can always adjust.")],a:{en:"“I'll send you a quote and you let me know” · ending without a date · asking “do you want to book?”.",es:"“Le mando la cotización y me avisa” · terminar sin fecha · preguntar “¿quiere reservar?”."},x:{en:"Confirmation text + written quote today.",es:"Texto de confirmación + cotización escrita hoy."}},
{n:{en:"After the call",es:"Después de la llamada"},t:{en:"Confirm, remind, deliver, review, repeat",es:"Confirmar, recordar, entregar, reseña, repetir"},s:{en:"The sale is done, now protect it and grow it: confirmation with the quote in writing, reminder the day before, on-the-way text, review request, and the recurring or next-season offer.",es:"La venta está hecha, ahora protégela y hazla crecer: confirmación con la cotización por escrito, recordatorio el día anterior, texto en camino, solicitud de reseña y la oferta recurrente o de la próxima temporada."},ex:[Y("Hi [Name], it's [Name] with [Company]. Confirmed: Thursday at 9, deep clean, [rate]. Included: [scope]. Reply here with anything we should know. Thank you!"),Y("Reminder: we'll be there tomorrow at 9. Please leave the alarm off and let us know if plans changed."),Y("Our team is on the way, about 20 minutes out."),Y("Thanks for having us today! If everything looked great, a Google review would mean a lot: [link]. Anything not right, tell me and we fix it."),Y("Hi [Name], it's been about two weeks since the deep clean, want me to set up the biweekly so it stays that way? Same team, [rate] per visit.")],a:{en:"Going silent after the booking · no reminder · never asking for the review.",es:"Silencio después de la reserva · sin recordatorio · nunca pedir la reseña."},x:{en:"Review → referral → recurring.",es:"Reseña → referido → recurrente."}}],
ob:[
{n:{en:"Before you call",es:"Antes de llamar"},t:{en:"Warm leads only, with a real reason",es:"Solo leads tibios, con una razón real"},s:{en:"Residential outbound is never cold: a past customer, a quote that never booked, a referral, a neighbor of someone you clean for, or a customer you haven't seen since last season. Before dialing, open their record: what you did for them, what they said last time, what they paid, and any detail about the home (pets, kids, the kitchen they cared about). Then write your reason to call in one line, a season, a referral, a slot that opened. Call between 9 and 6, never during dinner.",es:"El outbound residencial nunca es frío: un cliente pasado, una cotización que nunca reservó, un referido, el vecino de alguien a quien ya limpias, o un cliente que no ves desde la temporada pasada. Antes de marcar, abre su registro: qué le hiciste, qué dijo la última vez, qué pagó y cualquier detalle de la casa (mascotas, niños, la cocina que le importaba). Luego escribe tu razón para llamar en una línea, una temporada, un referido, un horario que se abrió. Llama entre 9 y 6, nunca a la hora de la cena."},ex:[Y("Reason to call: “We did your move-in clean in March and spring spots are opening.”"),Y("Reason to call: “The Garcias two doors down mentioned you were asking about us.”"),Y("Reason to call: “You asked for a quote in June, Thursday just opened up.”")],a:{en:"Buying lists of homeowners · calling without opening the record · leading with a discount.",es:"Comprar listas de hogares · llamar sin abrir el registro · empezar con un descuento."},x:{en:"Open with the connection.",es:"Abre con la conexión."}},
{n:{en:"Opening",es:"Apertura"},t:{en:"The connection first, then one open question",es:"La conexión primero, luego una pregunta abierta"},s:{en:"Say who you are and why you are calling in one breath, using the connection, the last job, the referral, the old quote. Then ask one open question and let them talk. If the timing is bad, ask for a better time and end there; a residential call that starts with an apology never recovers.",es:"Di quién eres y por qué llamas en una sola frase, usando la conexión, el último trabajo, el referido, la cotización vieja. Luego haz una pregunta abierta y déjalos hablar. Si el momento es malo, pide una mejor hora y termina ahí; una llamada residencial que empieza con disculpas nunca se recupera."},ex:[Y("Hi [Name], this is [Name] with [Company], we did your move-in clean back in March. How's the house been treating you?"),Y("Hi [Name], [Name] with [Company]. We clean for the Garcias two doors down and they mentioned you might want some help, is that still the case?"),Y("Hi [Name], you asked us for a quote in June and we never got to book it. Is a clean still something you'd like? What's going on with the house these days?"),T("Now's not a great time."),Y("No problem, would this evening around 6 or tomorrow morning be better? I'll keep it to two minutes.")],a:{en:"Apologizing for calling · pitching before they answer · more than one question at a time.",es:"Disculparte por llamar · pitch antes de que respondan · más de una pregunta a la vez."},x:{en:"Ask, then recommend.",es:"Pregunta, luego recomienda."}},
